<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Voetbalbaas</title>
<style>
:root{--bg:#352879;--rand:#6c5eb5;--tekst:#c9c3ff;--wit:#fff;--geel:#ffe66b;--groen:#7ee07e;--rood:#ff7b7b;--vak:#2a1f66}
*{box-sizing:border-box}
html,body{margin:0;background:var(--rand);color:var(--tekst);font:15px/1.4 "Courier New",ui-monospace,monospace;font-weight:bold;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:calc(10px + env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom))}
#scherm{max-width:560px;margin:0 auto;background:var(--bg);border-radius:6px;padding:14px 14px 18px;min-height:calc(100vh - 30px)}
.terug{position:fixed;z-index:10;top:calc(6px + env(safe-area-inset-top));left:calc(6px + env(safe-area-inset-left));width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);border:1.5px solid var(--tekst);color:var(--wit);font:bold 20px/30px Georgia,serif;text-align:center;text-decoration:none}
h1{font-size:26px;letter-spacing:3px;color:var(--wit);text-align:center;margin:6px 0 2px}
h2{font-size:18px;color:var(--geel);margin:14px 0 6px;letter-spacing:1px}
p{margin:6px 0}
.sub{text-align:center;margin:0 0 12px}
.knop{display:block;width:100%;margin:7px 0;padding:11px 12px;border:2px solid var(--tekst);border-radius:4px;background:var(--vak);color:var(--wit);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.knop:active{background:var(--rand)}
.knop.groot{background:var(--geel);color:#222;border-color:var(--wit);text-align:center;font-size:18px}
.knop.klein{display:inline-block;width:auto;padding:6px 10px;font-size:14px;margin:3px 4px 3px 0}
.knop:disabled{opacity:.4}
.rij{display:flex;gap:8px;align-items:center}
.vak{background:var(--vak);border-radius:4px;padding:8px 10px;margin:8px 0}
.club{display:inline-block;width:14px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:6px;border:1px solid #000}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:3px 3px;text-align:right;white-space:nowrap}
td:nth-child(2),th:nth-child(2){text-align:left}
th{color:var(--geel)}
tr.jij td{color:var(--geel)}
tr.omhoog td:first-child{color:var(--groen)}tr.omlaag td:first-child{color:var(--rood)}
.speler{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid #4a3d99;cursor:pointer}
.speler.aan{background:#4c3fa8}
.speler.kan-niet{opacity:.45;cursor:default}
.vink{width:20px;height:20px;border:2px solid var(--tekst);border-radius:3px;text-align:center;line-height:16px;color:var(--geel)}
.pos{width:22px;text-align:center;border-radius:3px;color:#111}
.pos.K{background:#ffe66b}.pos.V{background:#8fd3ff}.pos.M{background:#9cf29c}.pos.A{background:#ff9c9c}
.naam{flex:1;color:var(--wit);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kr{width:34px;text-align:right}
.cond{width:46px;height:8px;background:#222;border-radius:4px;overflow:hidden}
.cond i{display:block;height:100%;background:var(--groen)}
.balk{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:13px}
.balk span:first-child{width:128px;font-size:12px;white-space:nowrap}
.balk .b{flex:1;height:10px;background:#222;border-radius:5px;position:relative;overflow:hidden}
.balk .b i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.goed{color:var(--groen)}.slecht{color:var(--rood)}.geel{color:var(--geel)}.wit{color:var(--wit)}
.melding{border-left:4px solid var(--geel);padding:4px 8px;margin:6px 0;background:var(--vak)}
#bord{display:flex;justify-content:space-between;align-items:center;background:#000;color:var(--geel);padding:6px 8px;border-radius:4px;font-size:15px;gap:6px}
#bord .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bord .s{font-size:22px;color:var(--wit);padding:0 6px}
#bord .min{width:40px;text-align:right;color:var(--groen)}
canvas{display:block;width:100%;margin:8px 0;border-radius:4px;background:#2f8a3a;image-rendering:pixelated}
#verslag{min-height:44px;color:var(--wit);text-align:center;font-size:16px}
.klein{font-size:13px}
.kop{flex:none;width:26px;height:32px;background:url(voetbalbaas/hoofden.webp) no-repeat;border-radius:4px;cursor:pointer;background-color:#4c3fa8}
.profiel{display:flex;gap:12px;align-items:flex-start}
.profiel table{flex:1;min-width:0;font-size:13px}.profiel #pop{flex:none;width:110px}
.profiel canvas{width:110px;height:auto;flex:none;background:transparent;margin:0}
.profiel table td{text-align:left;padding:2px 4px}.profiel table td:last-child{text-align:right;color:var(--wit)}
.veldfoto{display:block;width:100%;aspect-ratio:640/350;background:url(voetbalbaas/velden.jpg) 0 0/400% 100% no-repeat;border-radius:4px;border:2px solid var(--wit)}
#vak-veld{position:relative}
#vak-veld .veldfoto{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;border:0;box-shadow:0 0 0 40px var(--bg)}
#vak-veld{overflow:hidden;border-radius:4px}
.portret{display:block;flex:none;width:72px;aspect-ratio:240/270;background:url(voetbalbaas/managers.jpg) 0 0/800% 100% no-repeat;border-radius:4px;border:2px solid var(--wit)}
.portret.groot{width:120px}
.mgr{display:flex;gap:10px;align-items:center}
.mgr .quote{flex:1;color:var(--wit);font-size:15px}
.nieuwsfoto{display:block;width:100%;aspect-ratio:480/260;background:url(voetbalbaas/nieuws.jpg) 0 0/1600% 100% no-repeat;border-radius:3px;margin:2px 0 6px;border:2px solid var(--wit)}
.bekerfoto{display:block;width:100%;aspect-ratio:480/260;background:url(voetbalbaas/beker.jpg) 0 0/400% 100% no-repeat;border-radius:3px;margin:4px 0 8px;border:2px solid var(--wit)}
.melding.met-foto.klein-foto .nieuwsfoto{float:left;width:84px;margin:2px 8px 2px 0;border-width:1px}
.melding.met-foto::after{content:"";display:block;clear:both}
/* kantoor: plaatje met plekken om op te tikken (KANTOOR) */
.kantoor{position:relative;margin:0 0 10px;border-radius:4px;overflow:hidden;border:2px solid var(--tekst)}
.kantoor img{display:block;width:100%;height:auto}
.kantoor button{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kantoor button span{background:rgba(42,31,102,.85);color:var(--geel);font:bold 11px/1.2 "Courier New",monospace;padding:2px 5px;border-radius:3px;border:1px solid var(--geel);white-space:nowrap}
.kantoor button:hover span,.kantoor button:active span{background:var(--geel);color:#222}
@media (max-width:480px){.kantoor button span{font-size:9px;padding:1px 3px}}
</style>

<body>
<a class="terug" href="./" aria-label="Terug naar de spellen">‹</a>
<div id="scherm"></div>
<script>
// ============ Voetbalbaas ============
// Een eigen voetbalmanager in oude-computerstijl. Uitleg: uitleg/voetbalbaas.md
const $=s=>document.querySelector(s);
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),kies=a=>a[Math.floor(R()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const euro=n=>(n<0?'-':'')+'€ '+Math.abs(Math.round(n)).toLocaleString('nl-NL');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- opslag per speler ----------
let NAAM='';try{NAAM=localStorage.getItem('speler')||''}catch(e){}
const SLEUTEL='voetbalbaas'+(NAAM?':'+NAAM:'');
function lees(){try{const v=localStorage.getItem(SLEUTEL)??localStorage.getItem('voetbalbaas');return v?JSON.parse(v):null}catch(e){return null}}
function bewaar(){try{localStorage.setItem(SLEUTEL,JSON.stringify(S))}catch(e){}}

// ---------- vaste gegevens ----------
const DIVNAAM={4:'Kelderklasse',3:'Derde klasse',2:'Tweede klasse',1:'Ereklasse'};
const BASIS={4:6,3:9,2:12,1:15};          // gemiddelde kracht in die divisie
const PUBLIEK={4:700,3:1600,2:3200,1:6500};
const KAARTJE={4:8,3:10,2:12,1:15};     // normale kaartjesprijs per divisie
// Kaartjesprijs zelf kiezen (S.prijs): goedkoper = meer publiek (en meer thuisvoordeel), duurder = minder publiek.
const prijs=()=>S.prijs||KAARTJE[S.div];
const vraag=p=>clamp(1.6-0.6*p/KAARTJE[S.div],0.15,1.8);
const verwachtPubliek=p=>Math.round(PUBLIEK[S.div]*(1+(8-(S.week?plek():4))/16)*vraag(p));
const thuisvoordeel=()=>1.15*Math.pow(vraag(prijs()),0.3);
const SPONSOR={4:1500,3:2500,2:5000,1:9000};
const PRIJS={4:2500,3:5000,2:10000,1:20000}; // prijzengeld per plek boven de laatste
const CLUBS=[
 ['VV De Halve Liter','#f2c200','#ffffff'],['FC Frikandel','#8b4513','#ff3030'],['SV Bosplassers','#1f7a2a','#ffe66b'],['Racing Rookworst','#d03a2a','#ffffff'],
 ['Kaaskoppen \'04','#ff9a1a','#222222'],['VV Natte Sokken','#3a6fd8','#ffffff'],['SC Snackbar Sjors','#ffffff','#d02020'],['FC Kater Maandag','#6a2a8a','#ffe66b'],
 ['Blauw-Wit Bitterbal','#2a50c8','#ffffff'],['VV Bierviltje','#ffffff','#1a3a9a'],['Sparta Stamppot','#c82020','#ffffff'],['FC Kroket','#c88a2a','#5a2a00'],
 ['SV Hooiberg','#e8d040','#2a7a2a'],['Fortuna Friet','#ffe000','#d02020'],['VV Gras Groeit','#30a030','#ffffff'],['De Derde Helft','#222222','#ffe66b'],
 ['FC Polderjongens','#1a8ac8','#ffffff'],['Hercules Hagelslag','#3a2a1a','#ffffff'],['SC Stroopwafel','#d8a040','#6a3a10'],['Vitesse Vla','#ffe68a','#222222'],
 ['Go Ahead Gehakt','#b02020','#ffe66b'],['Achilles Appeltaart','#a0c030','#8a3a10'],['VV Wolkje','#9fd8ff','#ffffff'],['RKSV Rookpluim','#888888','#2a8a2a'],
 ['AZ Zuurkool','#e02020','#ffffff'],['Real Rookvlees','#ffffff','#7a2a8a'],['Inter Ontbijtkoek','#1a1a8a','#000000'],['Dynamo Drop','#111111','#c02020'],
 ['Olympique Oliebol','#ffffff','#2a80d8'],['Bayern Boerenkool','#c81830','#ffffff'],['Juventus Jenever','#ffffff','#111111'],['Atletico Appelflap','#d02020','#ffffff']];
const VOOR=['Kees','Henk','Jan','Piet','Sjaak','Bram','Daan','Sem','Lucas','Mo','Youssef','Kevin','Rik','Joep','Thijs','Gijs','Bas','Ruud','Arjen','Wesley','Frenkie','Teun','Jesse','Milan','Stijn','Koen','Sven','Hakim','Tim','Ferdi','Dirk','Barry','Ricardo','Jordy','Mats','Noah','Luuk','Ole','Kenzo','Gerrit'];
const VOOR_V=['Sanne','Lieke','Vivianne','Daniëlle','Jill','Lineth','Esmee','Fenna','Romée','Jackie','Kika','Lynn','Isa','Noor','Fleur','Tess','Yara','Zoë','Sara','Amira','Femke','Merel','Iris','Jet','Lotte','Mila','Nina','Puck','Roos','Saar','Dewi','Shanice','Ilse','Marieke','Gerda','Truus','Bo','Kim','Ayla','Fay'];
const ACHTER=['de Vries','Jansen','Bakker','Visser','Smit','Meijer','de Boer','Mulder','de Groot','Bos','Vos','Peters','Hendriks','van Dijk','Dekker','Brouwer','de Wit','Dijkstra','Smits','de Graaf','van der Meer','Kok','Jacobs','Bitterbal','Pilsje','Kroket','Frikandel','van Plassen','Snor','Haantjes','Klomp','Stamppot','van Gras','Rookworst','Knol','Hagelslag','Tapkraan','Schuim','Bierbuik','Graskamp'];
let volgId=1;
// Competitie: 'heren', 'dames' of 'gemengd' (S.soort). p.v = speelster. soortNu geldt tijdens het aanmaken van een nieuw spel.
let soortNu='heren';try{soortNu=localStorage.getItem('voetbalbaas_soort')||'heren'}catch(e){}
const soort=()=>(S&&S.soort)||soortNu;
const nieuwV=()=>soort()=='dames'||(soort()=='gemengd'&&R()<0.5);
// Moeilijkheid (S.niveau, gekozen op het beginscherm; oude opslag = normaal). teg = verschil in kracht van de tegenstanders,
// start = extra kracht eigen spelers bij het begin, groei = factor op trainingskansen, punten = factor op managerpunten.
const MOEI={makkelijk:{naam:'😎 Makkelijk',uitleg:'Zwakkere tegenstanders, sterkere spelers en meer geld. Lekker snel naar de top (wel minder managerpunten).',teg:-2.5,start:1.5,geld:80000,ontslag:-60000,groei:2.5,punten:0.5},
 normaal:{naam:'⚽ Normaal',uitleg:'Zoals het spel bedoeld is.',teg:0,start:0,geld:40000,ontslag:-25000,groei:1,punten:1},
 moeilijk:{naam:'🔥 Moeilijk',uitleg:'Sterkere tegenstanders, weinig geld en een streng bestuur. Wel 1,5 keer zoveel managerpunten.',teg:1,start:-0.5,geld:20000,ontslag:-10000,groei:0.8,punten:1.5}};
let niveauNu='normaal';try{niveauNu=localStorage.getItem('voetbalbaas_niveau')||'normaal'}catch(e){}
const MOE=()=>MOEI[(S&&S.niveau)||niveauNu]||MOEI.normaal;
const hij=p=>p&&p.v?'zij':'hij',Hij=p=>p&&p.v?'Zij':'Hij',hem=p=>p&&p.v?'haar':'hem';
const praat=q=>soort()=='dames'?q.replace(/jongens/g,'meiden').replace(/mannen/g,'meiden').replace(/\bboys\b/g,'girls'):q;
// Eigenschappen (p.eig): ongeveer 1 op de 3 spelers heeft er een. Effecten: lijnen() (muur, snel, kapitein, supersub),
// zetSchutters (snel scoort vaker), naAfloop (glas: vaker geblesseerd), gebeurtenis (kater), waarde (kater goedkoper), strafschoppen (killer).
const EIG={
 snel:{t:'⚡',naam:'Snelheidsduivel',uitleg:'Scoort vaker, en is extra gevaarlijk als je op de counter speelt.',pos:'MA'},
 muur:{t:'🧱',naam:'De Muur',uitleg:'Verdedigt 20% beter dan zijn kracht zegt.',pos:'V'},
 kapitein:{t:'Ⓒ',naam:'Aanvoerder',uitleg:'Speelt de aanvoerder mee, dan speelt het hele team 4% beter.',pos:'VMA'},
 glas:{t:'🥚',naam:'Van glas',uitleg:'Heel goed (+2 kracht), maar raakt veel vaker geblesseerd.',pos:'VMA'},
 kater:{t:'🍺',naam:'Feestbeest',uitleg:'Gaat elke week mee naar de kantine: vaak een kater. Wel goedkoper.',pos:'KVMA'},
 joker:{t:'🔥',naam:'Supersub',uitleg:'Valt de supersub in de rust in, dan is de tweede helft 30% beter.',pos:'MA'},
 killer:{t:'🧤',naam:'Penaltykiller',uitleg:'Stopt veel vaker strafschoppen.',pos:'K'}};
function geefEig(p){const opties=Object.keys(EIG).filter(k=>EIG[k].pos.includes(p.pos));if(R()<0.35&&opties.length){p.eig=kies(opties);if(p.eig=='glas')p.kracht=clamp(p.kracht+2,1,20)}else p.eig='';return p}
function nieuweSpeler(pos,kr){const v=nieuwV();return geefEig({id:volgId++,v,naam:kies(v?VOOR_V:VOOR)+' '+kies(ACHTER),pos,kracht:clamp(Math.round(kr),1,20),leeftijd:ri(18,32),cond:100,blessure:0,schorsing:0,goals:0,uit:ri(2,4),sp:0,tr:0,kop:ri(0,35),lijf:pos=='K'?4:kies([0,1,1,2,3])})}
const waarde=p=>Math.round(p.kracht*p.kracht*350*(p.leeftijd<24?1.2:p.leeftijd>30?0.7:1)*(p.eig=='kater'?0.8:1)/500)*500;
const salaris=p=>Math.round(p.kracht*p.kracht*5/10)*10;
const kun=p=>!p.blessure&&!p.schorsing;
const eff=p=>p.kracht*(0.5+0.5*p.cond/100);

// ---------- spelstatus ----------
let S=lees();if(S)volgId=S.volgId||1000;
if(S&&!S.soort)S.soort='heren'; // oude opslag = herencompetitie
if(S&&!S.niveau)S.niveau='normaal';
if(S&&!S.eigVerdeeld){S.spelers.forEach(p=>{if(p.eig==null){geefEig(p);if(p.eig=='glas')p.kracht-=2}});(S.markt||[]).forEach(p=>{if(p.eig==null)p.eig=''});S.eigVerdeeld=true} // oude opslag: geen gratis +2
if(S)S.spelers.concat(S.markt||[]).forEach(p=>{if(p.uit==null){p.uit=ri(2,4);p.sp=p.sp||0;p.tr=p.tr||0}if(p.kop==null){p.kop=p.id%36;p.lijf=p.pos=='K'?4:[0,1,1,2,3][(p.id*7)%5]}}); // uithouding en uiterlijk voor oude opslag

function nieuwSpel(clubId,eigen){ // eigen = {naam,k1,k2}: eigen club, neemt de plek van een club in de Kelderklasse in
 S=null; // het oude spel is weg; soort() kijkt nu naar soortNu
 const clubs=CLUBS.map((c,i)=>({id:i,naam:c[0],k1:c[1],k2:c[2],div:4-Math.floor(i/8),niveau:0}));
 if(soortNu=='dames')clubs.forEach(c=>c.naam+=' Vrouwen');
 if(eigen)Object.assign(clubs[clubId],eigen);
 clubs.forEach(c=>c.niveau=BASIS[c.div]+rnd(-1.5,1.5));
 const sp=[];const b=BASIS[4];
 [['K',2],['V',5],['M',5],['A',4]].forEach(([pos,n])=>{for(let i=0;i<n;i++)sp.push(nieuweSpeler(pos,b+MOEI[niveauNu].start+rnd(-1.5,2)))});
 S={soort:soortNu,niveau:niveauNu,club:clubId,clubs,spelers:sp,opstelling:[],geld:MOEI[niveauNu].geld,seizoen:1,week:0,div:4,berichten:['Welkom bij '+clubs[clubId].naam+'! Het bestuur verwacht dat je niet degradeert. Succes, baas!'],erelijst:[],markt:[],volgId};
 S.opstelling=besteElf();nieuwSeizoen();nieuweMarkt();bewaar();
}
function nieuwSeizoen(){
 const ids=S.clubs.filter(c=>c.div==S.div).map(c=>c.id).sort(()=>R()-.5);
 const rondes=[];let a=ids.slice();
 // thuis/uit: wie tot nu toe het minst thuis speelde (of vorige ronde uit speelde) speelt thuis, zodat het om en om gaat
 const thuis={},vorig={};ids.forEach(i=>{thuis[i]=0;vorig[i]=0});
 for(let r=0;r<7;r++){const p=[];for(let i=0;i<4;i++){let x=a[i],y=a[7-i];
   if(thuis[y]<thuis[x]||(thuis[y]==thuis[x]&&vorig[y]<vorig[x]))[x,y]=[y,x];
   thuis[x]++;vorig[x]=1;vorig[y]=0;p.push([x,y])}
  rondes.push(p);a.splice(1,0,a.pop())}
 S.schema=rondes.concat(rondes.map(r=>r.map(([x,y])=>[y,x])));S.uitslagen=[];S.week=0;
 S.beker={ronde:0,eruit:false,gehad:[],tegen:null};S.goals={};
}
function nieuweMarkt(){
 const b=BASIS[S.div];S.markt=[];
 for(let i=0;i<4;i++){const p=nieuweSpeler(kies(['K','V','V','M','M','A','A']),b+rnd(-2,i==3?5:3));p.prijs=Math.round(waarde(p)*rnd(1,1.3)/500)*500;S.markt.push(p)}
 S.volgId=volgId;
}
const club=id=>S.clubs[id];
const mijn=()=>club(S.club);

// ---------- sterkte ----------
function lijnen(ids,pijn,inv){const l={K:0,V:0,M:0,A:0},n={K:0,V:0,M:0,A:0};let kap=false; // pijn = speler met een pijntje (half zo goed), inv = ingevallen in de rust
 ids.forEach(id=>{const p=S.spelers.find(x=>x.id==id);if(!p)return;let e=eff(p)*(id==pijn?0.5:1);
  if(p.eig=='muur'&&p.pos=='V')e*=1.2;if(p.eig=='snel'&&S.tactiek=='counter')e*=1.15;if(p.eig=='joker'&&inv&&inv.includes(id))e*=1.3;if(p.eig=='kapitein')kap=true;
  l[p.pos]+=e;n[p.pos]++});
 if(kap)for(const k in l)l[k]*=1.04;return{l,n}}
// Kenmerken van een ploeg (l = opgetelde kracht per linie, n = aantal spelers per linie):
//  qA = gemiddelde kracht van wie aanvalt (aanvallers + een kwart van het middenveld), nA = hoeveel dat er zijn
//  qD = gemiddelde kracht van de verdediging (verdedigers + kwart middenveld, plus de keeper), nD = hoeveel
//  M  = middenveld: bepaalt wie de kansen krijgt
// Kans op een goal ~ (qA/qD)^1.3 × √(nA/3) / (nD/5)^1.5: meer aanvallers = meer goals, meer verdedigers = minder tegengoals.
function sterkte(l,n){const nA=n.A+0.25*n.M,nD=n.V+0.25*n.M;
 return{qA:nA?(l.A+0.25*l.M)/nA:0,nA,qD:0.75*(nD?(l.V+0.25*l.M)/nD:0)+0.25*l.K,nD,M:l.M+0.15*(l.V+l.A),K:l.K}}
const tegenPloeg=L=>{L=Math.max(1,L+MOE().teg);return sterkte({K:L,V:4*L,M:4*L,A:2*L},{K:1,V:4,M:4,A:2})}; // tegenstanders spelen 4-4-2 (kracht volgens de moeilijkheid)
const aanvalWaarde=s=>s.qA*Math.pow(s.nA/3,0.5/1.3),verdWaarde=s=>s.qD*Math.pow(s.nD/5,1.5/1.3);
// Tactiek: counter = minder vaak de bal, maar gevaarlijker als de tegenstander veel aanvalt (ruimte achterin bij hen);
// aanvallen = vaker de bal, maar meer ruimte achterin bij ons.
const TACTIEK={normaal:{s:1,eig:0,teg:1,naam:'Normaal',uitleg:'Gewoon je spel spelen.'},
 counter:{s:0.65,eig:0.9,teg:0.9,naam:'Op de counter',uitleg:'Achterin dicht, minder vaak de bal, maar snel en gevaarlijk uitbreken. Vooral goed tegen sterkere ploegen.'},
 aanval:{s:1.3,eig:0,teg:1.3,naam:'Aanvallen!',uitleg:'Vaker de bal en vaker voor het doel, maar achterin gaten. Vooral goed tegen zwakkere ploegen (of als je achter staat).'}};
function besteElf(){
 const vrij=S.spelers.filter(kun).sort((a,b)=>eff(b)-eff(a)),gekozen=[];
 const pak=(pos,n)=>{for(const p of vrij){if(n<=0)break;if(p.pos==pos&&!gekozen.includes(p)){gekozen.push(p);n--}}};
 pak('K',1);pak('V',4);pak('M',4);pak('A',2);
 for(const p of vrij){if(gekozen.length>=11)break;if(!gekozen.includes(p)&&p.pos!='K')gekozen.push(p)}
 return gekozen.map(p=>p.id);
}
function opstellingFout(){
 const o=S.opstelling.map(id=>S.spelers.find(p=>p.id==id)).filter(Boolean);
 if(o.some(p=>!kun(p)))return'Er staat een geblesseerde of geschorste speler in je opstelling.';
 if(o.length!=11)return'Je moet precies 11 spelers kiezen (nu '+o.length+').';
 if(o.filter(p=>p.pos=='K').length!=1)return'Je hebt precies één keeper nodig.';
 return'';
}

// ---------- wedstrijd uitrekenen ----------
function simuleer(sH,sA,tv=1.15,tH=TACTIEK.normaal,tA=TACTIEK.normaal,van=2,tot=89,n=ri(8,11)){ // sH/sA = sterkte(), tv = thuisvoordeel, tH/tA = tactiek, van-tot = minuten
 const ev=[],mh0=Math.pow(sH.M,1.5)*tv,ma0=Math.pow(sA.M,1.5),ph=mh0/(mh0+ma0),mh=mh0*tH.s,ma=ma0*tA.s;
 const minuten=Array.from({length:n},()=>ri(van,tot)).sort((a,b)=>a-b);
 for(const m of minuten){const thuis=R()<mh/(mh+ma),at=thuis?sH:sA,vd=thuis?sA:sH,ta=thuis?tH:tA,tvd=thuis?tA:tH;
  const pg=clamp(0.3*Math.pow(at.qA/(vd.qD||1),1.3)*Math.pow(at.nA/3,0.5)/Math.pow(Math.max(vd.nD,0.5)/5,1.5)*(1+ta.eig*(thuis?1-ph:ph))*tvd.teg,0.03,0.7);
  let uit;if(R()<pg)uit='goal';else{const pr=clamp(0.5+(vd.K-BASIS[S.div])*0.03,0.3,0.75);uit=R()<pr?'redding':R()<0.18?'lat':'naast'}
  ev.push({min:m,thuis,uit})}
 return ev;
}
function tel(ev){return[ev.filter(e=>e.thuis&&e.uit=='goal').length,ev.filter(e=>!e.thuis&&e.uit=='goal').length]}
function stand(){
 const t={};S.clubs.filter(c=>c.div==S.div).forEach(c=>t[c.id]={id:c.id,g:0,w:0,gl:0,v:0,dv:0,dt:0,p:0});
 for(const wk of S.uitslagen)for(const u of wk){const h=t[u.h],a=t[u.a];if(!h||!a)continue;h.g++;a.g++;h.dv+=u.dh;h.dt+=u.da;a.dv+=u.da;a.dt+=u.dh;
  if(u.dh>u.da){h.w++;h.p+=3;a.v++}else if(u.dh<u.da){a.w++;a.p+=3;h.v++}else{h.gl++;a.gl++;h.p++;a.p++}}
 return Object.values(t).sort((x,y)=>y.p-x.p||(y.dv-y.dt)-(x.dv-x.dt)||y.dv-x.dv||x.id-y.id);
}
const plek=()=>stand().findIndex(r=>r.id==S.club)+1;
// de eerstvolgende wedstrijd: eerst de beker als die deze week is, anders de competitie
function tegenNu(){if(bekerNu()){bekerLoting();return{thuis:S.beker.thuis,teg:S.beker.tegen,beker:true}}return volgende()}
function volgende(){const w=S.schema[S.week];if(!w)return null;const m=w.find(([h,a])=>h==S.club||a==S.club);return{h:m[0],a:m[1],thuis:m[0]==S.club,teg:m[0]==S.club?m[1]:m[0]}}

// ---------- de week spelen ----------
// schutters en namen bij de kansen van jouw team
function zetSchutters(ev,wijThuis){
 const aanvallers=S.opstelling.map(id=>S.spelers.find(p=>p.id==id)).filter(p=>p&&p.pos!='K');
 const kiesSchutter=()=>{const w=aanvallers.map(p=>p.kracht*(p.pos=='A'?4:p.pos=='M'?1.5:0.3)*(p.eig=='snel'?1.6:1));let t=R()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){t-=w[i];if(t<=0)return aanvallers[i]}return aanvallers[0]};
 ev.forEach(e=>{e.wij=e.thuis==wijThuis;if(e.wij){const s=kiesSchutter();e.schutter=s.naam;e.sid=s.id;e.helpers=[kies(aanvallers).naam,kies(aanvallers).naam]}});
}
// conditie, blessures, schorsingen na een wedstrijd (week = er gaat ook een week voorbij: blessures tellen af, rust herstelt)
function naAfloop(berichten,week){
 S.spelers.forEach(p=>{if(week){if(p.blessure)p.blessure--;if(p.schorsing)p.schorsing--}
  if(S.opstelling.includes(p.id)){p.cond=clamp(p.cond-Math.round(ri(5,11)*(1.3-0.15*(p.uit||3))),20,100);p.sp=(p.sp||0)+1;
   if(R()<(p.eig=='glas'?0.09:0.035)){p.blessure=ri(1,3);berichten.push(`🩹 ${p.naam} is geblesseerd geraakt (${p.blessure} ${p.blessure>1?'weken':'week'}).`)}
   else if(R()<0.012){p.schorsing=1;berichten.push(`🟥 ${p.naam} kreeg rood voor een sliding op de scheids. 1 week geschorst.`)}}
  else if(week)p.cond=clamp(p.cond+(TRAINING[S.training||'normaal'].rust),0,100)});
 S.opstelling=S.opstelling.filter(id=>{const p=S.spelers.find(x=>x.id==id);return p&&kun(p)});
}

// ---------- training ----------
// Elke competitieweek: schema voor de hele groep (S.training) en eventueel extra training voor één speler (S.extra, geldt één week).
// p.uit = uithouding 1-5 (hoe snel hij moe wordt), p.tr = trainingspunten en p.sp = gespeelde wedstrijden dit seizoen (voor de
// ontwikkeling aan het eind van het seizoen, zie seizoenKlaar).
const TRAINING={
 rustig:{naam:'Rustig aan',uitleg:'Lekker bijkomen. Wie niet speelt herstelt extra goed. Niemand wordt beter.',rust:35,moe:0,tr:0,kracht:0,uith:0},
 normaal:{naam:'Normaal',uitleg:'Gewoon trainen. Langzaam maar zeker beter worden.',rust:25,moe:0,tr:1,kracht:0.02,uith:0.01},
 conditie:{naam:'Conditie',uitleg:'Rondjes rennen! Iedereen wat moe, maar kans dat spelers minder snel moe worden (uithouding +1).',rust:20,moe:5,tr:1,kracht:0,uith:0.08},
 hard:{naam:'Keihard',uitleg:'Afzien! Iedereen moe, kans op +1 kracht per speler. Spelers van glas kunnen geblesseerd raken.',rust:18,moe:6,tr:2,kracht:0.09,uith:0}};
const groeiKans=(p,k)=>MOE().groei*k*(p.leeftijd<23?1.5:p.leeftijd>30?0.5:1)*(p.kracht>=BASIS[S.div]+5?0.5:1);
function trainen(berichten){
 const t=TRAINING[S.training||'normaal'],beter=[],fitter=[];
 S.spelers.forEach(p=>{if(p.blessure)return;
  p.cond=clamp(p.cond-t.moe,10,100);p.tr=(p.tr||0)+t.tr;
  if(R()<groeiKans(p,t.kracht)&&p.kracht<20){p.kracht++;beter.push(p.naam)}
  if(R()<t.uith&&(p.uit||3)<5){p.uit=(p.uit||3)+1;fitter.push(p.naam)}
  if(S.training=='hard'&&p.eig=='glas'&&R()<0.1){p.blessure=1;berichten.push(`🩹 ${p.naam} verrekte iets op de keiharde training (1 week).`)}});
 if(beter.length)berichten.push(`💪 Training: ${beter.join(', ')} ${beter.length>1?'zijn':'is'} sterker geworden (+1 kracht)!`);
 if(fitter.length)berichten.push(`🏃 Conditietraining: ${fitter.join(', ')} ${fitter.length>1?'worden':'wordt'} minder snel moe.`);
 const x=S.extra&&S.spelers.find(p=>p.id==S.extra);
 if(x&&!x.blessure){x.cond=clamp(x.cond-20,10,100);x.tr=(x.tr||0)+3;
  if(R()<groeiKans(x,0.25)&&x.kracht<20){x.kracht++;berichten.push(`💪 Extra training: ${x.naam} is sterker geworden (+1 kracht)!`)}
  else berichten.push(`🏋️ Extra training: ${x.naam} heeft zich kapot gewerkt, maar is nog niet sterker.`)}
 S.extra=null;
}
function trainingScherm(){
 const t=S.training||'normaal',lijst=S.spelers.slice().sort((a,b)=>VOLG[a.pos]-VOLG[b.pos]||b.kracht-a.kracht);
 teken(`<h1 style="font-size:20px">🏋️ TRAINING</h1><p class="sub">Geldt voor de komende competitieweek</p>
 <h2>Schema voor de hele groep</h2>
 ${Object.entries(TRAINING).map(([k,x])=>`<button class="knop" data-tr="${k}" style="${k==t?'background:var(--geel);color:#222':''}"><b>${x.naam}</b><br><span class="klein">${x.uitleg}</span></button>`).join('')}
 <h2>Extra training voor één speler</h2>
 <p class="klein">Die speler wordt flink moe (−20 conditie), maar heeft een goede kans op +1 kracht. Jonge spelers groeien sneller, voor topspelers is het lastiger. Handig voor iemand die op de bank zit.</p>
 <div>${lijst.map(p=>spelerRij(p,p.id==S.extra,`<span class="vink">${p.id==S.extra?'✓':''}</span>`).replace('class="naam">',`class="naam">`).replace('<span class="kr"',`<span class="klein" title="uithouding" style="width:30px">🏃${p.uit||3}</span><span class="kr"`)).join('')}</div>
 <p class="klein">🏃 = uithouding (1-5): hoe hoger, hoe minder snel moe. Spelers die veel spelen en trainen worden aan het eind van het seizoen eerder beter.</p>
 <button class="knop groot" id="klaar">Klaar</button>`);
 scherm.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{S.training=b.dataset.tr;bewaar();const y=scrollY;trainingScherm();scrollTo(0,y)});
 scherm.querySelectorAll('.speler').forEach(rw=>rw.onclick=()=>{const id=+rw.dataset.id,p=S.spelers.find(x=>x.id==id);if(p.blessure)return;S.extra=S.extra==id?null:id;bewaar();const y=scrollY;trainingScherm();scrollTo(0,y)});
 $('#klaar').onclick=kantoor;schermNu=trainingScherm;
}

// ---------- de beker: De Gouden Bierpul ----------
// 4 rondes, gespeeld vóór de competitiewedstrijd van week 3, 6, 9 en 12 (BEKERWEKEN = S.week-index).
// Tegenstanders worden steeds sterker (ook uit hogere divisies); gelijk = strafschoppen. Finale in het grote stadion.
const BEKERWEKEN=[2,5,8,11],BEKERRONDE=['Achtste finale','Kwartfinale','Halve finale','Finale'];
const BEKERPRIJS=[3000,6000,12000,30000],BEKERFACTOR={4:1,3:1.6,2:2.5,1:4};
const BEKERNAAM='De Gouden Bierpul';
function bekerNu(){const b=S.beker;return!!(b&&!b.eruit&&b.ronde<4&&S.week==BEKERWEKEN[b.ronde]&&b.gespeeldWeek!==S.week)}
function bekerLoting(){const b=S.beker;if(b.tegen!=null)return;
 const r=b.ronde,d=clamp([ri(S.div-1,S.div+1),ri(S.div-1,S.div),S.div-1,S.div-2][r],1,4);
 let pool=S.clubs.filter(c=>c.id!=S.club&&c.div==d&&!b.gehad.includes(c.id));if(!pool.length)pool=S.clubs.filter(c=>c.id!=S.club&&!b.gehad.includes(c.id));
 b.tegen=kies(pool).id;b.thuis=r==3?true:R()<.5;b.gehad.push(b.tegen);bewaar();
}
function strafschoppen(wijK,zijK){ // 5 elk, daarna om en om tot het beslist is
 const p=k=>clamp(0.78-(k-BASIS[S.div])*0.012,0.6,0.88);const w=[],z=[];
 for(let i=0;;i++){w.push(R()<p(zijK));z.push(R()<p(wijK));const a=w.filter(Boolean).length,b=z.filter(Boolean).length;
  if(i<4){const rest=4-i;if(a>b+rest||b>a+rest)break}else if(a!=b)break}
 return{wij:w,zij:z};
}
function bekerAfmaken(ev,berichten){
 const b=S.beker,t=club(b.tegen),finale=b.ronde==3,{l}=lijnen(S.opstelling),[dh,da]=tel(ev);
 const voor=b.thuis?dh:da,tegen=b.thuis?da:dh;let pens=null,door=voor>tegen;
 if(voor==tegen){const kp=S.spelers.find(p=>S.opstelling.includes(p.id)&&p.pos=='K');pens=strafschoppen(l.K+(kp&&kp.eig=='killer'?8:0),t.niveau);door=pens.wij.filter(Boolean).length>pens.zij.filter(Boolean).length}
 let inkomsten=0,toesch=0;
 if(finale){toesch=Math.round(PUBLIEK[1]*rnd(2.5,3.2));inkomsten=Math.round(15000*BEKERFACTOR[S.div]/500)*500} // jouw deel van de finale-opbrengst
 else if(b.thuis){toesch=Math.round(verwachtPubliek(prijs())*rnd(1.1,1.5));inkomsten=toesch*prijs()}
 const prijsgeld=door?Math.round(BEKERPRIJS[b.ronde]*BEKERFACTOR[S.div]):0;
 S.geld+=inkomsten+prijsgeld;
 naAfloop(berichten,false);
 const ronde=BEKERRONDE[b.ronde];
 if(door){b.ronde++;b.tegen=null;if(b.ronde==4){S.bekers=(S.bekers||[]).concat(S.seizoen);S.prijzen=(S.prijzen||0)+1;S.punten=(S.punten||0)+Math.round(50*(5-S.div)*MOE().punten);setTimeout(insturen,0);berichten.unshift(`🏆 ${mijn().naam} wint ${BEKERNAAM}! Er wordt de hele nacht uit de beker gedronken.`)}}
 else b.eruit=true;
 b.gespeeldWeek=S.week;
 S.laatste={ev,h:b.thuis?S.club:t.id,a:b.thuis?t.id:S.club,dh,da,res:voor>tegen?'w':voor<tegen?'v':'g',inkomsten,toesch,lonen:0,berichten,week:S.week,
  beker:{ronde,finale,door,pens,prijsgeld,gewonnen:door&&finale}};
 bewaar();
}

// ---------- een wedstrijd in twee helften ----------
// startWedstrijd rekent de eerste helft uit (S.lopend, wordt bewaard: herladen = terug naar de rust). In de rust kun je wisselen
// en de tactiek veranderen; afmaken rekent dan de tweede helft uit en verwerkt de uitslag (competitie of beker).
function startWedstrijd(){
 const bk=bekerNu();let lo;
 if(bk){bekerLoting();const b=S.beker,t=club(b.tegen);lo={beker:true,teg:b.tegen,thuis:b.thuis,tv:b.ronde==3?1:b.thuis?thuisvoordeel():1.15,hunL:t.niveau*rnd(0.9,1.1)}}
 else{const v=volgende();lo={beker:false,teg:v.teg,thuis:v.thuis,tv:v.thuis?thuisvoordeel():1.15,hunL:club(v.teg).niveau*rnd(0.88,1.12)}}
 const veld=S.opstelling.map(id=>S.spelers.find(p=>p.id==id)).filter(p=>p&&p.pos!='K');
 lo.pijn=R()<0.3&&veld.length?kies(veld).id:null;lo.wissels=[];
 S.lopend=lo;lo.ev1=helft(1);zetSchutters(lo.ev1,lo.thuis);bewaar();
}
function helft(h){const lo=S.lopend,{l,n}=lijnen(S.opstelling,h==2?lo.pijn:null,h==2?lo.inv:null),ons=sterkte(l,n),hun=tegenPloeg(lo.hunL),mijnT=TACTIEK[S.tactiek]||TACTIEK.normaal;
 const van=h==1?2:46,tot=h==1?45:89,k=ri(4,6);
 return lo.thuis?simuleer(ons,hun,lo.tv,mijnT,TACTIEK.normaal,van,tot,k):simuleer(hun,ons,lo.tv,TACTIEK.normaal,mijnT,van,tot,k)}
function afmaken(){
 const lo=S.lopend;if(!lo)return;const ev2=helft(2);zetSchutters(ev2,lo.thuis);const ev=lo.ev1.concat(ev2),berichten=[];
 if(lo.wissels.length)berichten.push('🔁 Wissels: '+lo.wissels.join('; ')+'.');
 const pp=lo.pijn&&S.spelers.find(p=>p.id==lo.pijn),doorgespeeld=pp&&S.opstelling.includes(pp.id);
 delete S.lopend;
 // doelpunten voor de topscorerslijst (S.goals = dit seizoen per naam, p.goals = hele carrière bij de club)
 S.goals=S.goals||{};ev.filter(e=>e.wij&&e.uit=='goal'&&e.schutter).forEach(e=>{S.goals[e.schutter]=(S.goals[e.schutter]||0)+1;const p=S.spelers.find(x=>x.id==e.sid);if(p)p.goals=(p.goals||0)+1});
 if(lo.beker)bekerAfmaken(ev,berichten);else weekAfmaken(ev,lo,berichten);
 // wie met een pijntje doorspeelde, is daarna geblesseerd (na naAfloop, anders telt de blessure meteen een week af)
 if(doorgespeeld){pp.blessure=Math.max(pp.blessure,2);S.laatste.berichten.push(`🤕 ${pp.naam} speelde door met een pijntje. Nu is ${hij(pp)} 2 weken geblesseerd.`);S.opstelling=S.opstelling.filter(x=>x!=pp.id);bewaar()}
}
function weekAfmaken(mijnEv,lo,berichten){
 const v=volgende(),uit=[];
 for(const[h,a]of S.schema[S.week]){
  if(h==S.club||a==S.club){const[dh,da]=tel(mijnEv);uit.push({h,a,dh,da});continue}
  const ev=simuleer(tegenPloeg(club(h).niveau*rnd(0.88,1.12)),tegenPloeg(club(a).niveau*rnd(0.88,1.12))),[dh,da]=tel(ev);uit.push({h,a,dh,da})}
 S.uitslagen.push(uit);
 const u=uit.find(x=>x.h==S.club||x.a==S.club),voor=v.thuis?u.dh:u.da,tegen=v.thuis?u.da:u.dh;
 // geld
 let inkomsten=SPONSOR[S.div],toesch=0;
 if(v.thuis){toesch=Math.round(verwachtPubliek(prijs())*rnd(0.8,1.2));inkomsten+=toesch*prijs()}
 const lonen=S.spelers.reduce((t,p)=>t+salaris(p),0);
 S.geld+=inkomsten-lonen;
 naAfloop(berichten,true);
 trainen(berichten);
 // gebeurtenis
 if(R()<0.4)berichten.push(gebeurtenis());
 const res=voor>tegen?'w':voor<tegen?'v':'g';
 S.laatste={ev:mijnEv,h:u.h,a:u.a,dh:u.dh,da:u.da,res,inkomsten,toesch,lonen,berichten,week:S.week+1};
 S.week++;
 nieuweMarkt();
 if(S.geld<MOE().ontslag)S.ontslagen=true;
 bewaar();
}
function gebeurtenis(){
 const feest=S.spelers.filter(x=>x.eig=='kater'),p=feest.length&&R()<0.5?kies(feest):kies(S.spelers),b=S.div,bedrag=x=>Math.round(x*({4:1,3:1.6,2:2.5,1:4}[b])/100)*100;
 const lijst=[
  ()=>{const x=bedrag(2500);S.geld+=x;return`🍺 De kantine draaide een topweek, de tap heeft niet stilgestaan. +${euro(x)}`},
  ()=>{p.cond=clamp(p.cond-35,10,100);return`🥴 ${p.naam} heeft de derde helft iets te serieus genomen. Flinke kater, conditie omlaag.`},
  ()=>{if(p.blessure)return gebeurtenis();p.blessure=2;return`🌲 ${p.naam} ging even plassen in het bos achter het veld en verstapte zich over een boomwortel. 2 weken geblesseerd.`},
  ()=>{const x=bedrag(4000);S.geld+=x;return`📣 Snackbar Sjors betaalt ${euro(x)} voor een reclamebord langs het veld.`},
  ()=>{const x=bedrag(3000);S.geld-=x;return`🚿 De douches in de kleedkamer lekken. De loodgieter kost ${euro(x)}.`},
  ()=>{if(p.kracht>=20)return gebeurtenis();p.kracht++;return`💪 ${p.naam} heeft stiekem extra getraind. Kracht +1!`},
  ()=>{S.spelers.forEach(q=>q.cond=clamp(q.cond+12,0,100));return`🎉 De supporters hingen een enorm spandoek op. Iedereen heeft er zin in: conditie omhoog.`},
  ()=>{if(p.schorsing||p.blessure)return gebeurtenis();p.schorsing=1;return`🌿 ${p.naam} werd betrapt met een 'sigaretje' achter de dug-out. De bond schorst ${hem(p)} 1 week.`},
  ()=>{const x=bedrag(1500);S.geld-=x;return`🐄 Er stonden koeien op het veld. De boer wil ${euro(x)} voor het hek dat jullie kapot schopten.`},
  ()=>{const x=bedrag(2000);S.geld+=x;return`🎟️ De clubloterij was een succes (hoofdprijs: een krat bier). +${euro(x)}`},
 ];

const topscorers=()=>Object.entries(S.goals||{}).sort((a,b)=>b[1]-a[1]);
function seizoenKlaar(){
 const st=stand(),p=st.findIndex(r=>r.id==S.club)+1,d=S.div,info=[];
 const prijs=(8-p)*PRIJS[d]+(p==1?PRIJS[d]*3:0);S.geld+=prijs;
 info.push(`Je bent ${p}e geworden in de ${DIVNAAM[d]}. Prijzengeld: ${euro(prijs)}.`);
 // clubtopscorer: de Gouden Frikandel (kracht +1, als hij nog bij de club is)
 const tops=topscorers(),top=tops[0];
 if(top){const sp=S.spelers.find(x=>x.naam==top[0]);if(sp)sp.kracht=clamp(sp.kracht+1,1,20);
  info.push(`🌭 Clubtopscorer: ${top[0]} met ${top[1]} ${top[1]==1?'goal':'goals'}! ${Hij(sp)} krijgt de Gouden Frikandel${sp?' (kracht +1)':''}.`)}
 S.erelijst.push({seizoen:S.seizoen,div:d,plek:p,top:top?{naam:top[0],n:top[1]}:null});
 const promo=d>1&&p<=2,pnt=Math.round(seizoenPunten(d,p,promo)*MOE().punten);S.punten=(S.punten||0)+pnt;if(p==1)S.prijzen=(S.prijzen||0)+1;
 info.push(`⭐ Managerpunten dit seizoen: +${pnt} (totaal ${S.punten}).`);
 // promotie en degradatie
 const omhoog=d>1?st.slice(0,2).map(r=>r.id):[],omlaag=d<4?st.slice(6).map(r=>r.id):[];
 if(omhoog.length){const boven=S.clubs.filter(c=>c.div==d-1&&c.id!=S.club).sort((a,b)=>a.niveau-b.niveau).slice(0,4).sort(()=>R()-.5).slice(0,2);
  boven.forEach(c=>{c.div=d;c.niveau=BASIS[d]+rnd(0,1.5)});omhoog.forEach(id=>club(id).div=d-1)}
 if(omlaag.length){const onder=S.clubs.filter(c=>c.div==d+1).sort((a,b)=>b.niveau-a.niveau).slice(0,4).sort(()=>R()-.5).slice(0,2);
  onder.forEach(c=>{c.div=d;c.niveau=BASIS[d]+rnd(-1.5,0)});omlaag.forEach(id=>club(id).div=d+1)}
 S.clubs.forEach(c=>{if(c.id!=S.club)c.niveau=clamp(c.niveau*0.7+(BASIS[c.div]+rnd(-1.5,1.5))*0.3,1,20)});
 if(p==1)info.push(d==1?'🏆🏆🏆 LANDSKAMPIOEN! Je bent de beste voetbalbaas van het land!':'🏆 KAMPIOEN! Het hele dorp staat op zijn kop.');
 if(omhoog.includes(S.club)&&p!=1)info.push('⬆️ Je promoveert! Op naar de '+DIVNAAM[d-1]+'.');
 if(omhoog.includes(S.club)&&p==1)info.push('⬆️ Volgend seizoen speel je in de '+DIVNAAM[d-1]+'.');
 if(omlaag.includes(S.club))info.push('⬇️ Helaas, je degradeert naar de '+DIVNAAM[d+1]+'.');
 if(S.prijs)S.prijs=Math.max(1,Math.round(S.prijs*KAARTJE[mijn().div]/KAARTJE[d])); // kaartjesprijs schuift mee met de divisie
 S.div=mijn().div;
 // spelers worden ouder
 const weg=[];
 S.spelers.forEach(p=>{p.leeftijd++;
  // ontwikkeling: leeftijd + speeltijd + training (p.sp, p.tr)
  const leeft=p.leeftijd<24?ri(0,1):p.leeftijd<=30?(R()<0.3?-1:0):-ri(0,2),speel=p.sp>=7?(R()<0.5?1:0):p.sp<=2?-(R()<0.5?1:0):0,train=((p.tr||0)>=12&&R()<0.4?1:0)+((p.tr||0)>=24&&R()<0.3?1:0);
  const oud=p.kracht;p.kracht=clamp(p.kracht+leeft+speel+train,1,20);(p.hist=p.hist||[]).push(p.kracht);
  if(p.kracht-oud>=2)info.push(`📈 ${p.naam} maakte een flinke sprong: kracht ${oud} → ${p.kracht}.`);
  p.sp=0;p.tr=0;p.cond=100;p.blessure=0;p.schorsing=0;
  if(p.leeftijd>=35&&R()<0.6)weg.push(p)});
 weg.forEach(p=>{S.spelers.splice(S.spelers.indexOf(p),1);info.push(`👋 ${p.naam} (${p.leeftijd}) stopt met voetballen en gaat achter de bar staan.`)});
 S.seizoen++;S.opstelling=besteElf();nieuwSeizoen();nieuweMarkt();
 S.seizoenInfo={tabel:st,div:d,info};bewaar();insturen();
}

// ---------- managerpunten en het online scorebord ----------
// Managerpunten (carrière): per seizoen (9 − plek) × 10 × (5 − divisie), kampioen + 100 × (5 − divisie), promotie + 50,
// beker gewonnen + 50 × (5 − divisie). Prijzen = titels + bekers. Allebei naar het familiescorebord (extra/scorebord.gs),
// onderdelen voetbal_punten en voetbal_prijzen, modus carriere; alleen met een gekozen naam en alleen als het meer is dan al ingestuurd.
const BORD_URL='https://script.google.com/macros/s/AKfycbzo6b4TQRiL2j1ZhEtBa6xpbNcBxmL7IIIB6e1FdYWnswDIxJ1MphWAlAjm12aK_J9U/exec';
const seizoenPunten=(div,plek,promo)=>(9-plek)*10*(5-div)+(plek==1?100*(5-div):0)+(promo?50:0);
if(S&&S.punten==null){S.punten=(S.erelijst||[]).reduce((t,e)=>t+seizoenPunten(e.div,e.plek,false),0)+(S.bekers||[]).length*50;
 S.prijzen=(S.erelijst||[]).filter(e=>e.plek==1).length+(S.bekers||[]).length;bewaar()}
function insturen(){
 if(!NAAM||!S)return;const lk='voetbalbaas_ingestuurd:'+NAAM;let al={};try{al=JSON.parse(localStorage.getItem(lk)||'{}')}catch(e){}
 for(const[o,w]of[['voetbal_punten',S.punten||0],['voetbal_prijzen',S.prijzen||0]]){if(w<=0||w<=(al[o]||0))continue;
  fetch(BORD_URL+'?actie=opslaan&naam='+encodeURIComponent(NAAM)+'&onderdeel='+o+'&modus=carriere&score='+w,{redirect:'follow'})
   .then(r=>{if(!r.ok)throw 0;al[o]=w;try{localStorage.setItem(lk,JSON.stringify(al))}catch(e){}}).catch(()=>{})}
}
let bord=null;try{bord=JSON.parse(localStorage.getItem('voetbalbaas_bord')||'null')}catch(e){}
function scorebord(terug){
 const lijst=(k,eenheid)=>{const r=(bord&&bord[k])||[];return r.length?`<table>${r.map((x,i)=>`<tr class="${String(x.naam).toLowerCase()==NAAM.toLowerCase()?'jij':''}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(x.naam)}</td><td class="wit">${x.score} ${eenheid}</td></tr>`).join('')}</table>`:'<p class="klein">Nog niemand.</p>'};
 const toon=st=>{teken(`<h1 style="font-size:20px">🏆 SCOREBORD</h1><p class="sub">Van de hele familie</p>
  ${st?`<p class="klein" style="text-align:center">${st}</p>`:''}
  <h2>Managerpunten</h2>${lijst('voetbal_punten_carriere','punten')}

  Kampioen, promotie en de beker leveren extra op. ${NAAM?`Jouw score gaat er vanzelf op als je record beter is (als <b class="wit">${esc(NAAM)}</b>).`:'Kies op de startpagina een naam, anders komt je score er niet op.'}
  ${S?`<br>Jij nu: <b class="wit">${S.punten||0}</b> managerpunten, <b class="wit">${S.prijzen||0}</b> ${S.prijzen==1?'prijs':'prijzen'}.`:''}</div>
  <button class="knop groot" id="klaar">Terug</button>`);$('#klaar').onclick=terug;terugNaar=terug};
 toon('Laden…');
 fetch(BORD_URL,{redirect:'follow'}).then(r=>r.json()).then(d=>{bord=d;try{localStorage.setItem('voetbalbaas_bord',JSON.stringify(d))}catch(e){}if($('#klaar'))toon('')})
  .catch(()=>{if($('#klaar'))toon(bord?'Geen internet: dit is de laatst bekende stand.':'Geen internet, het scorebord kan nu niet geladen worden.')});

// ---------- geluid ----------
let ac=null;function geluidAan(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!='running')ac.resume()}catch(e){}}
document.addEventListener('pointerdown',geluidAan,{passive:true});
function toon(f,d,type='square',v=.05,glij=0,wacht=0){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+wacht;o.type=type;o.frequency.setValueAtTime(f,t);if(glij)o.frequency.linearRampToValueAtTime(f+glij,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function ruis(d,v=.08,wacht=0){if(!ac)return;try{const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(R()*2-1)*Math.sin(Math.PI*i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=900;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(ac.currentTime+wacht)}catch(e){}}
const fluit=(n=1)=>{for(let i=0;i<n;i++)toon(2400,.25,'sine',.05,80,i*.35)};
const trap=()=>toon(140,.08,'square',.06,-60);

const PS=1.6; // poppetjes en bal wat groter dan "echt", anders zie je ze op een telefoon niet

 bal(ctx,bb[0],bb[1],f1.hoog?Math.sin(u*Math.PI)*10:0);
 ctx.restore();
 if(f1.juich){ctx.fillStyle='#ffe66b';ctx.font='bold 54px "Courier New",monospace';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText('GOAL!',323,123);ctx.fillStyle='#ffe66b';ctx.fillText('GOAL!',320,120)}
 return klaar&&t>a.eind;
}

 const stemming=B?(B.door?'blij':'boos'):{w:'blij',g:'gelijk',v:'boos'}[L.res];

 teken(`<h1 class="${kop[1]}" style="font-size:24px">${kop[0]}</h1>
 <div class="vak" style="text-align:center"><div class="wit" style="font-size:18px">${esc(ch.naam)} ${L.dh} - ${L.da} ${esc(ca.naam)}</div>
 ${goals.length?`<div class="klein">⚽ ${goals.join(', ')}</div>`:''}
 ${B?`<div class="klein geel">🍺 ${B.ronde} van ${BEKERNAAM}${B.pens?` · strafschoppen ${B.pens.wij.filter(Boolean).length}-${B.pens.zij.filter(Boolean).length}`:''}</div>`:''}</div>
 ${B&&B.gewonnen?bekerFoto(3):B&&B.pens?bekerFoto(2):''}
 <div class="vak mgr">${portret(mgr(),stemming=='boos',true)}<span class="quote">“${esc(L.quote||(L.quote=praat(kies(praatLijst))))}”<br><span class="klein geel">${esc(MANAGERS[mgr()].naam)}</span></span></div>
 <h2>Geld${B?' uit de beker':' deze week'}</h2><div class="vak klein">
 ${B?`${L.toesch?`<div class="rij"><span style="flex:1">${L.toesch.toLocaleString('nl-NL')} toeschouwers${B.finale?' (jouw deel)':''}</span><span class="goed">+${euro(L.inkomsten)}</span></div>`:'<div class="rij"><span style="flex:1">Uitwedstrijd: de kaartjes zijn voor de thuisclub</span><span>€ 0</span></div>'}
 <div class="rij"><span style="flex:1">Prijzengeld</span><span class="${B.prijsgeld?'goed':''}">+${euro(B.prijsgeld)}</span></div>`:L.toesch?`<div class="rij"><span style="flex:1">${L.toesch.toLocaleString('nl-NL')} toeschouwers + sponsor</span><span class="goed">+${euro(L.inkomsten)}</span></div>`:`<div class="rij"><span style="flex:1">Sponsor (uitwedstrijd: de kaartjes zijn voor de thuisclub)</span><span class="goed">+${euro(L.inkomsten)}</span></div>`}
 ${B?'':`<div class="rij"><span style="flex:1">Salarissen</span><span class="slecht">-${euro(L.lonen)}</span></div>`}
 <div class="rij"><span style="flex:1" class="wit">Bank</span><span class="${S.geld<0?'slecht':'wit'}">${euro(S.geld)}</span></div></div>
 ${L.berichten.length?`<h2>Nieuws</h2>${L.berichten.map(b=>melding(b)).join('')}`:''}
 ${B?`<p class="klein">${B.door?(B.gewonnen?'De beker staat in de prijzenkast! (Hij is wel een beetje plakkerig.)':'Door naar de '+BEKERRONDE[S.beker.ronde].toLowerCase()+'! Over drie weken weer.'):'Helaas. Volgend seizoen beter.'} Nu eerst weer de competitie.</p>`:`<h2>Andere uitslagen</h2>${uitslagLijst(wk)}`}
 <button class="knop groot" id="door" style="margin-top:14px">Verder</button>`);
 if(B?B.door:L.res=='w')juich();
 S.berichten.push(...L.berichten);S.berichten=S.berichten.slice(-8);L.berichten=[];bewaar();
 $('#door').onclick=kantoor;
}

if(S&&S.laatste&&S.laatste.berichten&&S.laatste.berichten.length){S.berichten.push(...S.laatste.berichten);S.laatste.berichten=[];bewaar()}
beginScherm();
