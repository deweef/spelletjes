<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songfestival-hits</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(circle at 50% 20%, #5b2a9e, #1a0b3a 70%); display: flex; flex-direction: column; align-items: center; padding: 60px 16px 110px; }
  .terug { position: fixed; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; text-decoration: none; font-size: 26px; line-height: 38px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  .sub { opacity: .75; margin: 0 0 26px; min-height: 1.2em; }
  #speel { width: 170px; height: 170px; border-radius: 50%; border: 0; font-size: 70px; color: #3a1470; background: #ffd23f; box-shadow: 0 0 0 10px rgba(255,210,63,.25), 0 10px 30px rgba(0,0,0,.4); cursor: pointer; }
  #speel.speelt { animation: puls 1.1s ease-in-out infinite; }
  #speel.tik { animation: tik .8s ease-in-out infinite; }
  @keyframes tik { 50% { transform: scale(1.08); } }
  @keyframes puls { 50% { box-shadow: 0 0 0 22px rgba(255,210,63,.12), 0 10px 30px rgba(0,0,0,.4); } }
  .vraag { font-size: 28px; font-weight: 800; margin: 28px 0 6px; }
  .tip { opacity: .7; font-size: 14px; max-width: 340px; margin: 0 auto 18px; }
  /* de Spotify-speler: de titel en het plaatje zitten onder een afdekking, alleen het play-knopje rechts blijft vrij */
  #spelerdoos { position: relative; width: min(360px, 100%); height: 80px; border-radius: 12px; overflow: hidden; margin: 6px auto 0; }
  #afdek { position: absolute; inset: 0 64px 0 0; background: #2a1257; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: .97; }
  #toon { margin-top: 24px; padding: 12px 22px; border-radius: 30px; border: 2px solid #ffd23f; background: transparent; color: #ffd23f; font-size: 17px; font-weight: 700; cursor: pointer; }
  #antwoord { display: none; margin-top: 22px; }
  #antwoord .jaar { font-size: 64px; font-weight: 900; color: #ffd23f; line-height: 1; }
  #antwoord .wie { font-size: 20px; margin-top: 10px; }
  #antwoord .land { margin-top: 6px; opacity: .85; }
  .fout { margin-top: 30px; opacity: .85; line-height: 1.5; }
  #volgende { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom)); border: 0; border-radius: 30px; padding: 15px 28px; background: #fff; color: #3a1470; font: 800 18px system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.4); cursor: pointer; white-space: nowrap; }
  /* de scanner */
  #scanner { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #scanner video { width: 100%; height: 100%; object-fit: cover; }
  #kader { position: absolute; left: 50%; top: 45%; width: min(70vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%); border: 4px solid #ffd23f; border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
  #scantekst { position: absolute; left: 0; right: 0; top: calc(45% + min(35vw, 150px) + 20px); font-weight: 700; font-size: 17px; text-shadow: 0 1px 4px #000; }
  #stopscan { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<a class="terug" href="../">‹</a>
<h1>🎤 Songfestival-hits</h1>
<p class="sub" id="nummer"></p>
<div id="spel">
  <button id="speel" aria-label="Afspelen">▶</button>
  <div class="vraag">Welk jaar?</div>
  <p class="tip">Leg je kaartje op de goede plek in je tijdlijn. Begint hij niet vanzelf? Tik op ▶. Lukt dat ook niet, tik dan op het kleine ▶-knopje hieronder.</p>
  <div id="spelerdoos"><div id="speler"></div><div id="afdek">🤫 geheim</div></div>
  <button id="toon">Laat zien</button>
  <div id="antwoord"><div class="jaar"></div><div class="wie"></div><div class="land"></div></div>
</div>
<p class="fout" id="fout" hidden></p>
<button id="volgende">📷 Volgende kaartje</button>
<div id="scanner"><video id="video" playsinline muted></video><div id="kader"></div><div id="scantekst">Houd de QR-code in het vak</div><button id="stopscan" aria-label="Stoppen">✕</button></div>

<script src="geheim.js"></script>
<script src="slot.js"></script>
<script src="lib/jsQR.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let lijst = null, sleutel = null, L = null;

  // ---------- een kaartje laten zien ----------
  function fout(t) { $('spel').hidden = true; $('fout').hidden = false; $('fout').innerHTML = t; $('nummer').textContent = ''; }
  async function kaartje(k, s) {
    if (s && s != sleutel) { try { lijst = await SLOT.lijst(s); sleutel = s; } catch (e) { lijst = null; } }
    if (!lijst) { fout('Scan een kaartje met de knop hieronder of met de camera van je telefoon.'); return; }
    L = lijst.find((l) => l.id == k);
    if (!L) { fout('Dit kaartje ken ik niet.'); return; }
    $('spel').hidden = false; $('fout').hidden = true;
    $('nummer').textContent = 'Kaartje ' + L.id;
    $('antwoord').style.display = 'none'; $('toon').style.display = ''; $('afdek').style.display = '';
    zetKnop(false);
    laad('spotify:track:' + L.spotify);
  }
  function zetKnop(speelt) { $('speel').textContent = speelt ? '❚❚' : '▶'; $('speel').classList.toggle('speelt', speelt); }

  // ---------- Spotify ----------
  // De speler wordt pas gemaakt als we weten welk liedje het is, en een nieuw liedje laden we pas als de speler klaar is
  // (eerder laden laat hem vastlopen). Daarna proberen we meteen af te spelen; mag dat niet van de browser, dan knippert de ▶.
  // Automatisch starten: na het laden wachten we tot Spotify meldt dat het nieuwe liedje er is (een melding met een lengte), en
  // proberen we het daarna nog een paar keer (na 1, 2,5 en 4,5 s). Lukt het niet, dan mag de browser het niet en knippert de ▶.
  let api = null, ctl = null, klaar = false, speelt = false, wil = null, geladen = null, pogingen = [], wacht = false, zelfGestopt = false;
  function laad(uri) {
    wil = uri;
    if (!api) return;
    if (!ctl) {
      geladen = uri;
      api.createController($('speler'), { uri, width: '100%', height: 80 }, (c) => {
        ctl = c;
        c.addListener('playback_update', (e) => {
          speelt = !e.data.isPaused; zetKnop(speelt);
          if (speelt) { $('speel').classList.remove('tik'); stopPogingen(); }
          else if (wacht && e.data.duration > 0) { wacht = false; speel(); } // het nieuwe liedje is geladen: nu starten
        });
        c.addListener('ready', () => { if (klaar) return; klaar = true; if (wil != geladen) { geladen = wil; c.loadUri(wil); } probeer(); });
      });
    } else if (klaar && uri != geladen) { geladen = uri; ctl.loadUri(uri); probeer(); }
  }
  const speel = () => { if (ctl && !speelt && !zelfGestopt) try { ctl.play(); } catch (e) {} };
  function stopPogingen() { pogingen.forEach(clearTimeout); pogingen = []; wacht = false; }
  function probeer() {
    stopPogingen(); speelt = false; zelfGestopt = false; wacht = true;
    pogingen = [1000, 2500, 4500].map((t) => setTimeout(speel, t));
    pogingen.push(setTimeout(() => { wacht = false; if (!speelt) $('speel').classList.add('tik'); }, 5500));
  }
  window.onSpotifyIframeApiReady = (a) => { api = a; if (wil) laad(wil); };
  const s = document.createElement('script'); s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true; document.body.appendChild(s);
  $('speel').onclick = () => { if (!ctl) return; $('speel').classList.remove('tik'); if ($('speel').classList.contains('speelt')) { zelfGestopt = true; stopPogingen(); ctl.pause(); } else { zelfGestopt = false; ctl.play(); } };
  $('toon').onclick = () => {
    const a = $('antwoord');
    a.querySelector('.jaar').textContent = L.jaar;
    a.querySelector('.wie').innerHTML = '<b>' + L.artiest + '</b> – ' + L.titel;
    a.querySelector('.land').textContent = L.vlag + ' ' + L.land + (L.won ? ' · 🏆 winnaar' : '');
    a.style.display = 'block'; $('toon').style.display = 'none'; $('afdek').style.display = 'none';
  };

  // ---------- scannen in de pagina ----------
  let stroom = null, bezig = false;
  const doek = document.createElement('canvas'), g = doek.getContext('2d', { willReadFrequently: true });
  async function startScan() {
    if (ctl) ctl.pause();
    $('scanner').style.display = 'block'; $('scantekst').textContent = 'Houd de QR-code in het vak';
    try {
      stroom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    } catch (e) { $('scantekst').textContent = 'De camera mag niet aan. Sta de camera toe in je browser, of scan met de camera-app.'; return; }
    const v = $('video'); v.srcObject = stroom; await v.play().catch(() => {});
    bezig = true; requestAnimationFrame(kijk);
  }
  function stopScan() {
    bezig = false; $('scanner').style.display = 'none';
    if (stroom) { stroom.getTracks().forEach((t) => t.stop()); stroom = null; }
  }
  function kijk() {
    if (!bezig) return;
    const v = $('video');
    if (v.videoWidth) {
      const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w); doek.width = w; doek.height = h;
      g.drawImage(v, 0, 0, w, h);
      const r = jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (r && r.data) {
        try {
          const u = new URL(r.data); const k = u.searchParams.get('k'), s = u.hash.slice(1);
          if (k && u.pathname.includes('/songfestival/')) {
            stopScan(); if (navigator.vibrate) navigator.vibrate(60);
            history.replaceState(null, '', '?k=' + k + '#' + s); kaartje(k, s); return;
          }
        } catch (e) {}
        $('scantekst').textContent = 'Dat is geen songfestival-kaartje';
      }
    }
    requestAnimationFrame(kijk);
  }
  $('volgende').onclick = startScan;
  $('stopscan').onclick = stopScan;

  const q = new URLSearchParams(location.search);
  kaartje(q.get('k'), location.hash.slice(1));
</script>
</body>
</html>
