<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songfestival-hits</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(circle at 50% 20%, #5b2a9e, #1a0b3a 70%); display: flex; flex-direction: column; align-items: center; padding: 60px 16px 30px; }
  .terug { position: fixed; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.35); color: #fff; text-decoration: none; font-size: 26px; line-height: 38px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  .sub { opacity: .75; margin: 0 0 26px; }
  #speel { width: 170px; height: 170px; border-radius: 50%; border: 0; font-size: 70px; color: #3a1470; background: #ffd23f; box-shadow: 0 0 0 10px rgba(255,210,63,.25), 0 10px 30px rgba(0,0,0,.4); cursor: pointer; }
  #speel.speelt { animation: puls 1.1s ease-in-out infinite; }
  @keyframes puls { 50% { box-shadow: 0 0 0 22px rgba(255,210,63,.12), 0 10px 30px rgba(0,0,0,.4); } }
  .vraag { font-size: 28px; font-weight: 800; margin: 28px 0 6px; }
  .tip { opacity: .7; font-size: 14px; max-width: 340px; margin: 0 auto 18px; }
  /* de Spotify-speler: de titel en het plaatje zitten onder een afdekking, alleen het play-knopje rechts blijft vrij */
  #spelerdoos { position: relative; width: min(360px, 100%); height: 80px; border-radius: 12px; overflow: hidden; margin: 6px auto 0; }
  #afdek { position: absolute; inset: 0 64px 0 0; background: #2a1257; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: .97; }
  #toon { margin-top: 24px; padding: 12px 22px; border-radius: 30px; border: 2px solid #ffd23f; background: transparent; color: #ffd23f; font-size: 17px; font-weight: 700; cursor: pointer; }
  #antwoord { display: none; margin-top: 22px; }
  #antwoord .jaar { font-size: 64px; font-weight: 900; color: #ffd23f; line-height: 1; }
  #antwoord .wie { font-size: 20px; margin-top: 10px; }
  #antwoord .land { margin-top: 6px; opacity: .85; }
  .fout { margin-top: 40px; opacity: .85; }
</style>
</head>
<body>
<a class="terug" href="../">‹</a>
<h1>🎤 Songfestival-hits</h1>
<p class="sub" id="nummer"></p>
<div id="spel">
  <button id="speel" aria-label="Afspelen">▶</button>
  <div class="vraag">Welk jaar?</div>
  <p class="tip">Leg je kaartje op de goede plek in je tijdlijn. Speelt het niet? Tik dan op het kleine ▶-knopje hieronder.</p>
  <div id="spelerdoos"><div id="speler"></div><div id="afdek">🤫 geheim</div></div>
  <button id="toon">Laat zien</button>
  <div id="antwoord"><div class="jaar"></div><div class="wie"></div><div class="land"></div></div>
</div>
<script src="liedjes.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const k = +new URLSearchParams(location.search).get('k');
  const L = LIEDJES.find((l) => l.id == k);
  let ctl = null, speelt = false;
  if (!L) {
    $('spel').innerHTML = '<p class="fout">Dit kaartje ken ik niet. Scan een kaartje met de camera van je telefoon.</p>';
  } else {
    $('nummer').textContent = 'Kaartje ' + L.id;
    window.onSpotifyIframeApiReady = (api) => {
      api.createController($('speler'), { uri: 'spotify:track:' + L.spotify, width: '100%', height: 80 }, (c) => {
        ctl = c;
        c.addListener('playback_update', (e) => { speelt = !e.data.isPaused; $('speel').textContent = speelt ? '❚❚' : '▶'; $('speel').classList.toggle('speelt', speelt); });
      });
    };
    const s = document.createElement('script'); s.src = 'https://open.spotify.com/embed/iframe-api/v1'; s.async = true; document.body.appendChild(s);
    $('speel').onclick = () => { if (ctl) ctl.togglePlay(); };
    $('toon').onclick = () => {
      const a = $('antwoord');
      a.querySelector('.jaar').textContent = L.jaar;
      a.querySelector('.wie').innerHTML = '<b>' + L.artiest + '</b> – ' + L.titel;
      a.querySelector('.land').textContent = L.vlag + ' ' + L.land + (L.won ? ' · 🏆 winnaar' : '');
      a.style.display = 'block'; $('toon').style.display = 'none'; $('afdek').style.display = 'none';
    };
  }
</script>
</body>
</html>
