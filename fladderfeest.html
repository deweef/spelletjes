<title>Fladderfeest</title>
<style>

.terug:focus-visible{outline:2px solid #fff;outline-offset:2px}

<body>
<a class="terug" href="./" aria-label="Terug naar de spellen">‹</a>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
// Fladderfeest: tik om te fladderen en vlieg tussen de palen door.
// Drie figuren met elk een eigen wereld: Patatmeeuw (strand), Fladderkip (boerderij), Hommelbrom (bollenveld).
// Alles in "punten" van een scherm van 360 bij 640; het canvas schaalt mee met het scherm.
const TEGEL = location.hash == '#tegel'; // voor het plaatje op de startpagina (640x400)
const W = TEGEL ? 640 : 360, H = TEGEL ? 400 : 640, GROND = H - 80;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

// ---------- speler en records (per naam, zie de startpagina) ----------
let speler = ''; try { speler = localStorage.getItem('speler') || ''; } catch (e) {}
const sleutel = (f) => 'fladderfeest_' + f + (speler ? ':' + speler : '');
function record(f) { try { return +localStorage.getItem(sleutel(f)) || 0; } catch (e) { return 0; } }
function zetRecord(f, n) { try { localStorage.setItem(sleutel(f), n); } catch (e) {} }

// ---------- geluid ----------
let ac = null;
function unlock() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state != 'running') ac.resume(); } catch (e) {} if (typeof zorgMuziek == 'function') zorgMuziek(); }
function snd(f, d, type = 'square', v = 0.05, slide = 0, delay = 0) {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d + 0.02);
  } catch (e) {}
}
const sFlap = () => snd(300, 0.08, 'triangle', 0.05, 520);
const sPunt = () => { snd(880, 0.08, 'square', 0.03); snd(1320, 0.12, 'square', 0.03, 0, 0.06); };
const sHap = () => { snd(500, 0.05, 'square', 0.04, 300); snd(700, 0.08, 'triangle', 0.05, 0, 0.06); };
const sKrijs = () => { snd(1400, 0.25, 'sawtooth', 0.05, 700); snd(1300, 0.35, 'sawtooth', 0.04, 500, 0.22); };
const sBots = () => snd(140, 0.2, 'square', 0.06, 60);
const sKakel = () => { snd(620, 0.06, 'square', 0.05, 500); snd(560, 0.06, 'square', 0.05, 450, 0.1); snd(900, 0.3, 'sawtooth', 0.04, 500, 0.22); };
function ruis(d, v, filter, freq, delay = 0) { // ruis voor drums en bekkens
  if (!ac) return;
  try {
    const n = ac.currentTime + delay, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * d), ac.sampleRate), data = b.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = b; f.type = filter; f.frequency.value = freq;
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d);
    src.connect(f).connect(g).connect(arguments[5] || ac.destination); src.start(n);
  } catch (e) {}
}
// kraai: gitaar-feedback, een bekkenklap en "kraa!"
const sKraa = () => { snd(1800, 0.7, 'sine', 0.03, 2600); ruis(1.2, 0.08, 'highpass', 5000); snd(700, 0.18, 'sawtooth', 0.06, 420, 0.5); snd(650, 0.25, 'sawtooth', 0.06, 380, 0.75); };
const sWind = () => ruis(1.4, 0.05, 'bandpass', 600);
const sBrom = () => { snd(180, 0.6, 'sawtooth', 0.05, 70); snd(185, 0.6, 'square', 0.02, 75); };
const sMedaille = () => [660, 880, 1046, 1318].forEach((f, i) => snd(f, 0.2, 'triangle', 0.06, 0, i * 0.09));

// ---------- muziek (zelf gecomponeerd, de browser speelt het; knopje rechtsboven of toets M) ----------
// Per figuur een deuntje: melodie in achtsten (MIDI-nummers, 0 = rust, -1 = vorige noot aanhouden),
// per maat een akkoord voor de hoempa-begeleiding (bas op 1 en 3, akkoordje op de tussentellen).
const MUZIEK = {
  meeuw: { // vrolijk zeemansliedje
    tempo: 116, stijl: 'hoempa',
    melodie: [
      67, -1, 72, -1, 72, 74, 76, 72,   71, -1, 67, -1, 62, -1, 67, 71,
      76, -1, 76, 74, 72, -1, 76, 79,   79, -1, -1, 77, 74, -1, -1, 0,
      81, -1, 77, -1, 72, -1, 77, 81,   79, -1, 76, -1, 72, -1, 76, 79,
      77, 76, 74, 72, 71, -1, 67, -1,   72, -1, 76, -1, 72, -1, -1, 0,
    ],
    akkoorden: [[48, 52, 55], [43, 47, 50], [48, 52, 55], [43, 47, 50], [41, 45, 48], [48, 52, 55], [43, 47, 50], [48, 52, 55]],
  },
  kraai: { // stevige rock: vervormde powerchords en drums
    tempo: 142, stijl: 'rock',
    melodie: [
      64, -1, 67, 69, -1, 67, 64, 0,   67, -1, 71, -1, 69, 67, 64, -1,
      69, -1, 72, 71, 69, -1, 67, -1,  64, -1, -1, -1, 0, 0, 62, 64,
      72, -1, 71, 69, 67, -1, 69, -1,  74, -1, 72, 71, 69, -1, 71, -1,
      76, -1, 74, 71, 67, -1, 71, 74,  76, -1, -1, -1, -1, 0, 0, 0,
    ],
    akkoorden: [[40], [43], [45], [40], [36], [38], [40], [40]],
  },
  hommel: { // draaiorgelwals in driekwartsmaat
    tempo: 150, stijl: 'wals', maat: 6,
    melodie: [
      72, -1, -1, 69, -1, 72,   77, -1, -1, -1, 76, 74,   72, -1, -1, 70, -1, 67,   70, -1, -1, -1, -1, 0,
      67, -1, 70, -1, 72, -1,   76, -1, -1, 74, -1, 72,   69, -1, 72, -1, 77, -1,   77, -1, -1, -1, -1, 0,
    ],
    akkoorden: [[41, 45, 48], [41, 45, 48], [36, 40, 46], [36, 40, 46], [36, 40, 46], [36, 40, 46], [41, 45, 48], [41, 45, 48]],
  },
  kip: { // boerendeuntje met banjo-getokkel
    tempo: 128, stijl: 'banjo',
    melodie: [
      67, 69, 71, 67, 74, -1, 71, -1,   72, 71, 69, 72, 76, -1, 72, -1,
      71, 69, 67, 71, 74, -1, 79, -1,   78, -1, 76, 74, 69, -1, 0, 0,
      67, 67, 71, 71, 74, 74, 71, -1,   72, 72, 76, 76, 79, -1, 76, -1,
      74, 76, 74, 72, 71, -1, 69, -1,   67, -1, 71, -1, 67, -1, 0, 0,
    ],
    akkoorden: [[43, 47, 50], [48, 52, 55], [43, 47, 50], [50, 54, 57], [43, 47, 50], [48, 52, 55], [50, 54, 57], [43, 47, 50]],
  },
};
let muziekAan = true; try { muziekAan = localStorage.getItem('fladderfeest_muziek') != '0'; } catch (e) {}
let mGain = null, mSpeelt = false, mStap = 0, mVolgende = 0;
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
let vervorming = null;
function gitaar() { // vervormer voor de rockgitaar
  if (!vervorming) {
    vervorming = ac.createWaveShaper(); const k = 60, c = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    vervorming.curve = c; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    vervorming.connect(lp).connect(mGain);
  }
  return vervorming;
}
function noot(m, t, d, type, v, naar) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(hz(m), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(v * 0.5, t + d * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(naar || mGain); o.start(t); o.stop(t + d + 0.03);
}
function drum(soort, t) {
  if (soort == 'kick') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g).connect(mGain); o.start(t); o.stop(t + 0.2); return; }
  const d = soort == 'snare' ? 0.16 : 0.04, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * d), ac.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = b; f.type = soort == 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = soort == 'snare' ? 1800 : 7000;
  g.gain.setValueAtTime(soort == 'snare' ? 0.22 : 0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(f).connect(g).connect(mGain); src.start(t);
}
const achtste = () => 30 / (MUZIEK[fig.id].tempo + Math.min(40, score || 0) * 0.6); // sneller als het moeilijker wordt
function speelStap(i, t) {
  const mz = MUZIEK[fig.id], mel = mz.melodie, n = mel[i], d = achtste();
  if (n > 0) {
    let len = 1; while (mel[(i + len) % mel.length] == -1) len++;
    if (mz.stijl == 'wals') { noot(n, t, d * len * 0.9, 'square', 0.016); noot(n + 12, t, d * len * 0.85, 'sine', 0.03); noot(n + 19, t, d * len * 0.5, 'sine', 0.006); }
    else if (mz.stijl == 'rock') { noot(n, t, d * len * 0.95, 'sawtooth', 0.02, gitaar()); noot(n + 0.1, t, d * len * 0.95, 'square', 0.006); }
    else { noot(n, t, d * len * 0.95, 'square', 0.022); noot(n + 12, t, d * len * 0.6, 'triangle', 0.012); }
  }
  const maat = mz.maat || 8, ak = mz.akkoorden[Math.floor(i / maat) % mz.akkoorden.length], tel = i % maat;
  if (mz.stijl == 'wals') { // hoem-pa-pa, met een orgelpijp-achtige melodie
    if (tel == 0) noot(ak[0] - 12, t, d * 1.8, 'triangle', 0.1);
    if (tel == 2 || tel == 4) for (const a of ak) noot(a + 12, t, d * 0.8, 'square', 0.007);
    return;
  }
  if (mz.stijl == 'rock') { // chug-chug powerchords, drums: kick op 1 en "en-3", snare op 2 en 4, hihat elke achtste
    const g = gitaar(), w = ak[0], accent = tel == 0 || tel == 3 || tel == 6;
    for (const iv of [0, 7, 12]) noot(w + iv, t, d * (accent ? 1.6 : 0.55), 'sawtooth', accent ? 0.05 : 0.03, g);
    if (tel == 0 || tel == 3 || tel == 4) drum('kick', t);
    if (tel == 2 || tel == 6) drum('snare', t);
    drum('hihat', t);
    return;
  }
  if (mz.stijl == 'banjo') { // getokkel op elke achtste, bas op 1 en 3
    const rol = [ak[0], ak[1], ak[2], ak[0] + 12, ak[2], ak[1], ak[2], ak[0] + 12];
    noot(rol[tel] + 12, t, d * 0.5, 'square', 0.009); noot(rol[tel] + 24, t, d * 0.3, 'triangle', 0.01);
    if (tel == 0 || tel == 4) noot((tel ? ak[2] : ak[0]) - 12, t, d * 1.4, 'triangle', 0.09);
    return;
  }
  if (tel == 0) noot(ak[0] - 12, t, d * 1.6, 'triangle', 0.09); // hoem
  if (tel == 4) noot(ak[2] - 12, t, d * 1.6, 'triangle', 0.08);
  if (tel == 2 || tel == 6) for (const a of ak) noot(a + 12, t, d * 0.7, 'square', 0.008); // pa
}
setInterval(() => {
  if (!mSpeelt || !ac) return;
  if (mVolgende < ac.currentTime) mVolgende = ac.currentTime + 0.02;
  while (mVolgende < ac.currentTime + 0.15) { speelStap(mStap, mVolgende); mVolgende += achtste(); mStap = (mStap + 1) % MUZIEK[fig.id].melodie.length; }
}, 25);
function startMuziek() {
  if (!ac || !muziekAan || !MUZIEK[fig.id] || document.hidden) return;
  if (!mGain) { mGain = ac.createGain(); mGain.connect(ac.destination); }
  mGain.gain.cancelScheduledValues(ac.currentTime); mGain.gain.setValueAtTime(1, ac.currentTime);
  if (mSpeelt) return;
  mSpeelt = true; mStap = 0; mVolgende = ac.currentTime + 0.05;
}
function stopMuziek(woe) {
  if (!mSpeelt || !ac) { mSpeelt = false; return; }
  mSpeelt = false;
  mGain.gain.cancelScheduledValues(ac.currentTime); mGain.gain.setValueAtTime(mGain.gain.value, ac.currentTime); mGain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.25);
  if (woe) { // woeoeoe: de muziek zakt in elkaar
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'triangle'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.9);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 7; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
    o.connect(g).connect(ac.destination); o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
  }
}
function zorgMuziek() { if (staat == 'menu' || staat == 'klaar' || staat == 'spel') startMuziek(); }
function wisselMuziek() {
  muziekAan = !muziekAan; try { localStorage.setItem('fladderfeest_muziek', muziekAan ? '1' : '0'); } catch (e) {}
  if (muziekAan) { unlock(); zorgMuziek(); } else stopMuziek(false);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopMuziek(false); else zorgMuziek(); });

// ---------- de figuren ----------
// zwaarte: hoe snel hij valt, flap: hoe hard hij omhoog gaat
const FIGUREN = [
  { id: 'meeuw', naam: 'Patatmeeuw', wereld: 'Het strand', zwaarte: 0.36, flap: -6.4, max: 8.5, klaar: true,
    bonus: ['frietje', 'frietjes'], top: 'Patatkoning', palen: 'de strandpalen',
    au: ['Krijs! Mijn patat!', 'Wie zet daar nou een paal neer?', 'Krijs! Dat deed pijn.', 'Meeuwen kunnen echt niet tegen palen.', 'Mijn frietje! Nééé!'] },
  // de kip is zwaar: ze valt snel, maar fladdert krachtig
  { id: 'kip', naam: 'Fladderkip', wereld: 'De boerderij', zwaarte: 0.46, flap: -7.3, max: 10.5, klaar: true,
    bonus: ['maïskolf', 'maïskolven'], top: 'Kippenkoning', palen: 'de hooibalen',
    au: ['Tok tok… au!', 'Van schrik een ei gelegd!', 'Kippen kunnen dus níét vliegen.', 'Wie stapelt nou zoveel hooi?', 'Tok! Mijn kam zit scheef.', 'Ik ga terug naar het kippenhok.'] },
  // de rockkraai: zonnebril, kuif en studs; vliegt zoals de meeuw, iets pittiger
  { id: 'kraai', naam: 'Rockkraai', wereld: 'Het rockfestival', zwaarte: 0.39, flap: -6.7, max: 9.2, klaar: true,
    bonus: ['plectrum', 'plectrums'], top: 'Rockster', palen: 'de versterkers',
    au: ['Kraa! Mijn kuif!', 'Rock-’n-roll… au.', 'Die versterker stond te hard.', 'Kraa! Waar is mijn zonnebril?', 'Encore? Nee, even niet.', 'Ik had oordopjes moeten nemen.'] },
  // de hommel is licht: zweeft langzaam, kleine flapjes, en af en toe duwt een windvlaag hem omhoog of omlaag
  { id: 'hommel', naam: 'Hommelbrom', wereld: 'Het bollenveld', zwaarte: 0.25, flap: -5.0, max: 6.2, klaar: true, wind: true,
    bonus: ['nectardruppel', 'nectardruppels'], top: 'Bijenkoningin', palen: 'de tulpen en molenwieken',
    au: ['Bzzz… au!', 'Brom! Wie zette die tulp daar?', 'Ik ben een hommel, geen helikopter.', 'Bzzz… even uitrusten in een tulp.', 'Die wind! Dat was niet eerlijk.', 'Mijn vleugeltjes zijn moe.'] },
];
const MEDAILLES = [[100, '', '#b9f2ff'], [50, 'Goud', '#ffd34d'], [25, 'Zilver', '#d6dde3'], [10, 'Brons', '#d08a4a']];
const medaille = (n, f = fig) => { const m = MEDAILLES.find(([g]) => n >= g); return m && (m[0] == 100 ? [100, f.top, m[2]] : m); };

// ---------- spelstatus ----------
let staat = 'menu'; // menu, klaar (wacht op eerste tik), spel, dood, over
let fig = FIGUREN[0];
let vogel, palen, score, frietjes, snelheid, afstand, beeld = 0, schuif = 0, doodT = 0, tekstje = '', nieuwRecord = false, vallend = null;
const knoppen = []; // klikbare vlakken in het huidige scherm

let veren = [], juich = 0, wind = null, volgendeWind = 0;
function nieuwSpel() {
  veren = [];
  vogel = { x: W * 0.28, y: H * 0.42, vy: 0, flapT: 0, hoek: 0 };
  palen = []; score = 0; frietjes = 0; snelheid = 2.3; afstand = 215; nieuwRecord = false; vallend = null;
  wind = null; volgendeWind = 60 * 8;
  staat = 'klaar'; zorgMuziek();
}

// gat tussen de palen: in het begin ruim, langzaam krapper
const gat = () => Math.max(132, 178 - score * 1.1);
function nieuwePaal(x) {
  const g = gat(), marge = 70;
  const midden = marge + g / 2 + Math.random() * (GROND - 2 * marge - g);
  const p = { x, midden, gat: g, voorbij: false, nr: 1 + Math.floor(Math.random() * 99) };
  // af en toe een frietje in het gat
  if (palen.length && Math.random() < 0.35) p.friet = { y: midden + (Math.random() - 0.5) * (g * 0.4), weg: false };
  palen.push(p);
}

function flap() {
  unlock();
  if (staat == 'klaar') { staat = 'spel'; nieuwePaal(W + 60); }
  if (staat != 'spel') return;
  vogel.vy = fig.flap; vogel.flapT = 12; sFlap();
}

// ---------- invoer ----------
function naarSpel(x, y) { return { x: (x - cv.getBoundingClientRect().left) / cv.getBoundingClientRect().width * W, y: (y - cv.getBoundingClientRect().top) / cv.getBoundingClientRect().height * H }; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); unlock();
  const p = naarSpel(e.clientX, e.clientY);
  for (const k of knoppen) if (p.x > k.x && p.x < k.x + k.w && p.y > k.y && p.y < k.y + k.h) { k.doe(); return; }
  if (staat == 'klaar' || staat == 'spel') flap();
});
addEventListener('keydown', (e) => {
  if (e.code == 'Space' || e.code == 'ArrowUp' || e.code == 'Enter') {
    e.preventDefault();
    if (staat == 'klaar' || staat == 'spel') flap();
    else if (staat == 'over' && doodT > 40) nieuwSpel();
    else if (staat == 'menu') { fig = FIGUREN[0]; nieuwSpel(); }
  }
  if (e.code == 'Escape' && staat != 'menu') { staat = 'menu'; zorgMuziek(); }
  if (e.code == 'KeyM') wisselMuziek();
});
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

// ---------- spelregels (60 keer per seconde) ----------
function botst(cx, cy, r, x, y, w, h) {
  const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
const PAAL = 56, STRAAL = 12;

function stap() {
  beeld++; if (juich > 0) juich--;
  if (staat == 'menu' || staat == 'klaar') { schuif += 1.2; return; }
  if (staat == 'spel') {
    schuif += snelheid;
    vogel.vy = Math.min(fig.max, vogel.vy + fig.zwaarte);
    if (fig.wind && score >= 3) { // windvlagen: eerst een waarschuwing, dan anderhalve seconde duwen
      if (!wind && --volgendeWind <= 0) { wind = { t: 0, op: Math.random() < 0.5 ? -1 : 1 }; sWind(); }
      if (wind) {
        wind.t++;
        if (wind.t > 45) vogel.vy += wind.op * 0.11;
        if (wind.t > 45 + 90) { wind = null; volgendeWind = 60 * (6 + Math.random() * 5); }
      }
    }
    vogel.y += vogel.vy;
    if (vogel.flapT > 0) vogel.flapT--;
    if (vogel.y < 10) { vogel.y = 10; vogel.vy = Math.max(0, vogel.vy); }
    for (const p of palen) {
      p.x -= snelheid;
      if (!p.voorbij && p.x + PAAL < vogel.x) { p.voorbij = true; score++; sPunt(); juich = 24; snelheid = Math.min(3.3, 2.3 + score * 0.025); }
      if (p.friet && !p.friet.weg && Math.hypot(p.x + PAAL / 2 - vogel.x, p.friet.y - vogel.y) < 22) { p.friet.weg = true; frietjes++; score++; sHap(); }
      const boven = p.midden - p.gat / 2, onder = p.midden + p.gat / 2;
      const ins = wereld().smal || 0; // smallere steel onder de bloem (tulp)
      if (botst(vogel.x, vogel.y, STRAAL, p.x, -50, PAAL, boven + 50) || botst(vogel.x, vogel.y, STRAAL, p.x, onder, PAAL, 34) || botst(vogel.x, vogel.y, STRAAL, p.x + ins, onder + 34, PAAL - 2 * ins, GROND - onder)) return dood();
    }
    palen = palen.filter((p) => p.x > -PAAL - 10);
    const laatste = palen[palen.length - 1];
    if (laatste && laatste.x < W - afstand) nieuwePaal(laatste.x + afstand + Math.random() * 30);
    if (vogel.y + STRAAL >= GROND) { vogel.y = GROND - STRAAL; return dood(); }
  } else if (staat == 'dood' || staat == 'over') {
    doodT++;
    if (vogel.y + STRAAL < GROND) { vogel.vy = Math.min(10, vogel.vy + 0.5); vogel.y = Math.min(GROND - STRAAL, vogel.y + vogel.vy); }
    if (vallend) { vallend.vy += 0.3; vallend.y = Math.min(GROND - 4, vallend.y + vallend.vy); if (fig.id != 'kip') vallend.r += 0.15; }
    for (const v of veren) { v.x += v.vx; v.y += v.vy; v.vy = Math.min(0.8, v.vy + 0.08); v.vx *= 0.97; v.r += 0.05; v.l--; }
    veren = veren.filter((v) => v.l > 0);
    if (staat == 'dood' && doodT > 45) {
      staat = 'over'; doodT = 0;
      if (score > record(fig.id)) { nieuwRecord = record(fig.id) > 0 || score > 0; zetRecord(fig.id, score); }
      if (medaille(score)) sMedaille();
    }
  }
}

function dood() {
  staat = 'dood'; doodT = 0; sBots(); setTimeout({ kip: sKakel, kraai: sKraa, hommel: sBrom }[fig.id] || sKrijs, 150); stopMuziek(fig.id != 'kraai');
  vogel.vy = -5;
  vallend = fig.id == 'kip' ? { x: vogel.x - 6, y: vogel.y + 8, vy: 0, r: 0 } // van schrik een ei
    : fig.id == 'hommel' ? { x: vogel.x + 4, y: vogel.y + 6, vy: 0, r: 0 } // zijn nectar druppelt eruit
    : fig.id == 'kraai' ? { x: vogel.x + 12, y: vogel.y - 8, vy: -4, r: 0 } // zijn zonnebril vliegt eraf
    : { x: vogel.x + 14, y: vogel.y, vy: -3, r: 0 }; // het frietje valt uit zijn snavel
  if (fig.id == 'kip') for (let i = 0; i < 9; i++) veren.push({ x: vogel.x, y: vogel.y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, r: Math.random() * 6, l: 90 });
  tekstje = fig.au[Math.floor(Math.random() * fig.au.length)];
}

// stapel hooibalen; de bovenste stapel hangt aan touwen, op de onderste steekt een hooivork
function hooibalen(x, y, h, vanBoven) {
  const bh = 34;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 4, y, PAAL + 8, h); ctx.clip();
  const n = Math.ceil(h / bh) + 1;
  for (let i = 0; i < n; i++) {
    const by = vanBoven ? y + h - (i + 1) * bh : y + i * bh, sx = (i % 2 ? 3 : -3);
    ctx.fillStyle = '#e8c45a'; rrect(x + sx - 2, by, PAAL + 4, bh - 2, 5); ctx.fill();
    ctx.strokeStyle = '#c9a23a'; ctx.lineWidth = 1.2;
    for (let j = 1; j < 5; j++) { ctx.beginPath(); ctx.moveTo(x + sx, by + j * 6.5); ctx.lineTo(x + sx + PAAL, by + j * 6.5 + 2); ctx.stroke(); }
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x + sx + 12, by, 3, bh - 2); ctx.fillRect(x + sx + PAAL - 15, by, 3, bh - 2); // touwtjes
    ctx.fillStyle = '#f2d77a'; for (let j = 0; j < 4; j++) ctx.fillRect(x + sx - 3 + j * 16, by + (vanBoven ? bh - 4 : -1), 6, 3); // losse sprietjes
  }
  ctx.restore();
  if (!vanBoven) { // hooivork
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 40, y + 6); ctx.lineTo(x + 50, y - 26); ctx.stroke();
    ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = 2; ctx.beginPath();
    for (const d of [-5, 0, 5]) { ctx.moveTo(x + 50 + d * 0.3, y - 26); ctx.lineTo(x + 52 + d, y - 40); }
    ctx.moveTo(x + 46, y - 27); ctx.lineTo(x + 57, y - 25); ctx.stroke();
  }
}

// ---------- het rockfestival (Rockkraai) ----------

function versterkers(x, y, h, vanBoven) {
  if (vanBoven) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, PAAL, h); ctx.clip();
    ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, y + h); ctx.moveTo(x + PAAL - 10, y); ctx.lineTo(x + PAAL - 10, y + h); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath();
    for (let j = y + h - 24; j > y - 30; j -= 24) { ctx.moveTo(x + 10, j); ctx.lineTo(x + PAAL - 10, j + 12); ctx.lineTo(x + 10, j + 24); }
    ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#2b2b33'; rrect(x - 2, y + h - 18, PAAL + 4, 18, 4); ctx.fill(); // balk met spots
    for (const dx of [10, 28, 46]) {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + dx, y + h - 2, 7, 0, Math.PI); ctx.fill();
      ctx.fillStyle = ['#ff3c78', '#50c8ff', '#ffe14d'][(dx + Math.floor(beeld / 15)) % 3]; ctx.beginPath(); ctx.arc(x + dx, y + h, 4, 0, Math.PI); ctx.fill();
    }
    return;
  }
  const kh = 46;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 4, y, PAAL + 8, h); ctx.clip();
  for (let i = 0; i * kh < h + kh; i++) {
    const by = y + i * kh;
    ctx.fillStyle = '#16161c'; rrect(x - 2, by, PAAL + 4, kh - 2, 4); ctx.fill();
    ctx.fillStyle = '#2a2a33'; rrect(x + 2, by + 4, PAAL - 4, kh - 10, 3); ctx.fill();
    for (const [dx, dy] of [[15, 15], [PAAL - 15, 15], [15, 31], [PAAL - 15, 31]]) {
      ctx.fillStyle = '#0c0c10'; ctx.beginPath(); ctx.arc(x + dx, by + dy, 8, 0, 7); ctx.fill();
      const tril = beeld % 18 < 3 ? 1.5 : 0; ctx.fillStyle = '#3a3a46'; ctx.beginPath(); ctx.arc(x + dx, by + dy, 3 + tril, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
  ctx.fillStyle = '#e0c060'; rrect(x - 2, y, PAAL + 4, 10, 3); ctx.fill(); // gouden bovenrand met knopjes
  ctx.fillStyle = '#222'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(x + 8 + i * 10, y + 5, 2.5, 0, 7); ctx.fill(); }
}

  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-22, 2); ctx.lineTo(-15, 4); ctx.fill(); // angeltje
  ctx.fillStyle = '#f5c518'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 16, 12, 0, 0, 7); ctx.clip();
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-9, -12, 5, 24); ctx.fillRect(1, -12, 5, 24);
  ctx.fillStyle = '#fff4c8'; ctx.fillRect(-16, -12, 5, 24); ctx.restore(); // wit achterwerkje

  if (dood) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(14, -4); ctx.lineTo(18, 0); ctx.moveTo(18, -4); ctx.lineTo(14, 0); ctx.stroke(); }
  else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(17, -3, 2.4, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(17.6, -3, 1.2, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ff9aa8'; ctx.beginPath(); ctx.arc(15, 2.5, 1.8, 0, 7); ctx.fill(); // blosje

function achtergrondBollen() {
  const horizon = GROND - 140;

  ctx.fillStyle = lucht; ctx.fillRect(0, 0, W, horizon + 2);
  ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(W - 80, 70, 26, 0, 7); ctx.fill();
  for (let i = 0; i < 4; i++) { const x = ((i * 170 - schuif * 0.15) % (W + 200) + W + 200) % (W + 200) - 100; wolk(x, 60 + (i * 53) % 130, 0.8 + (i % 2) * 0.4); }

  ctx.fillStyle = '#8cc56a'; ctx.fillRect(0, horizon - 4, W, 8);
  for (let i = -1; i < W / 150 + 2; i++) {
    const x = i * 150 - ((schuif * 0.2) % 150);

  for (let r = 0; r < rijen; r++) {

function reuzentulp(x, y, h, kleur) {

  ctx.fillStyle = '#3f8a30'; ctx.fillRect(cx - 16, y + 26, 32, h); // dikke steel
  ctx.fillStyle = '#4c9a38'; ctx.fillRect(cx - 10, y + 26, 6, h);

  ctx.beginPath(); ctx.moveTo(cx - 6, y + h); ctx.quadraticCurveTo(x - 6, y + 90, cx - 4, y + 60); ctx.quadraticCurveTo(cx - 2, y + 100, cx, y + h); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 6, y + h); ctx.quadraticCurveTo(x + PAAL + 6, y + 120, cx + 4, y + 90); ctx.quadraticCurveTo(cx + 2, y + 130, cx, y + h); ctx.fill();
  ctx.fillStyle = kleur; // bloem: een kelk met drie punten
  ctx.beginPath(); ctx.moveTo(x - 2, y + 4); ctx.lineTo(x + 2, y + 26); ctx.quadraticCurveTo(cx, y + 40, x + PAAL - 2, y + 26); ctx.lineTo(x + PAAL + 2, y + 4);
  ctx.lineTo(x + PAAL - 12, y + 14); ctx.lineTo(cx, y - 6); ctx.lineTo(x + 12, y + 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(x + 14, y + 18, 5, 10, -0.2, 0, 7); ctx.fill();
}

    ctx.fillStyle = f.klaar ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.55)'; rrect(x, y, w, h, 18); ctx.fill();
    ctx.strokeStyle = f.klaar ? '#f2b81d' : 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.stroke();
    const bob = f.klaar ? Math.sin(beeld * 0.1 + i) * 4 : 0;
    ctx.globalAlpha = f.klaar ? 1 : 0.5;
    const fl = beeld % 40 < 12 ? 12 - beeld % 40 : 0;
    if (f.id == 'meeuw') { meeuw(x + 54, y + 44 + bob, -0.1, fl, 1.35); frietje(x + 84, y + 70, 0.3); }
    if (f.id == 'kip') { kip(x + 52, y + 46 + bob, 1.4, 0, fl); mais(x + 82, y + 72, 0.5); }
    if (f.id == 'kraai') { kraai(x + 52, y + 46 + bob, -0.1, fl, 1.35); plectrum(x + 84, y + 70, 0.3); }
    if (f.id == 'hommel') { hommel(x + 52, y + 46 + bob, 1.4, 0); nectar(x + 84, y + 72); }
    ctx.globalAlpha = 1;
    tekst(f.naam, x + 108, y + 26, 21, f.klaar ? '#1d3b57' : '#4d6478', 'left', null);
    tekst(f.wereld, x + 108, y + 49, 14, '#4d6478', 'left', null);
    if (f.klaar) {
      const r = record(f.id), m = medaille(r, f);
      tekst('Record: ' + r + (m ? '  · ' + m[1] : ''), x + 108, y + 71, 14, '#c0792a', 'left', null);
      knoppen.push({ x, y, w, h, doe: () => { if (fig != f) stopMuziek(false); fig = f; nieuwSpel(); } });
    } else {
      tekst('Komt nog!', x + 108, y + 71, 14, '#d6453b', 'left', null);
      knoppen.push({ x, y, w, h, doe: () => { tekstje = f.naam + ' is nog in de maak.'; doodT = beeld; } });
    }
  });
  if (tekstje && beeld - doodT < 120 && staat == 'menu') tekst(tekstje, W / 2, H - 52, 16, '#fff');
  else tekst(speler ? 'Speler: ' + speler : 'Kies je naam op de startpagina voor je eigen record', W / 2, H - 52, speler ? 17 : 13);
}

function scorebord() {
  tekst(String(score), W / 2, 70, 52, '#fff', 'center', '#1d3b57');
  if (frietjes) { wereld().bonus(W / 2 - 14, 122, 0); tekst('x' + frietjes, W / 2 + 2, 116, 16, '#fff', 'left', '#1d3b57'); }
}

function eindscherm() {
  const a = Math.min(1, doodT / 15);
  ctx.globalAlpha = a;
  const x = 34, y = 150, w = W - 68, h = 300;
  ctx.fillStyle = 'rgba(255,248,230,.96)'; rrect(x, y, w, h, 20); ctx.fill();
  ctx.strokeStyle = '#c0792a'; ctx.lineWidth = 4; ctx.stroke();
  tekst(tekstje, W / 2, y + 34, 17, '#d6453b', 'center', null);
  tekst('Punten', x + 70, y + 76, 15, '#4d6478', 'center', null);
  tekst(String(score), x + 70, y + 110, 38, '#1d3b57', 'center', null);
  tekst('Record', x + w - 70, y + 76, 15, '#4d6478', 'center', null);
  tekst(String(record(fig.id)), x + w - 70, y + 110, 38, '#1d3b57', 'center', null);
  if (nieuwRecord && score > 0) tekst('Nieuw record!', W / 2, y + 146, 20, '#ffe14d', 'center', '#c0792a');
  const m = medaille(score);
  if (m) {
    ctx.fillStyle = m[2]; ctx.beginPath(); ctx.arc(W / 2 - 60, y + 186, 18, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a6a2a'; ctx.lineWidth = 2; ctx.stroke();
    tekst('★', W / 2 - 60, y + 187, 18, '#fff', 'center', null);
    tekst(m[1] + '!', W / 2 - 30, y + 187, 20, '#1d3b57', 'left', null);
  } else {
    const volgende = [...MEDAILLES].reverse().find(([n]) => n > score);
    tekst('Nog ' + (volgende[0] - score) + ' voor ' + volgende[1].toLowerCase(), W / 2, y + 186, 16, '#4d6478', 'center', null);
  }
  if (frietjes) tekst(frietjes + ' ' + fig.bonus[frietjes == 1 ? 0 : 1] + ' gepikt', W / 2, y + 220, 14, '#c0792a', 'center', null);
  ctx.globalAlpha = 1;
  if (doodT > 25) {
    knop(x + 14, y + h - 62, w / 2 - 20, 46, 'Nog een keer', '#3fae5a', nieuwSpel);
    knop(x + w / 2 + 6, y + h - 62, w / 2 - 20, 46, 'Ander dier', '#3f8fd8', () => { staat = 'menu'; tekstje = ''; zorgMuziek(); });
  }
}

function muziekKnop() { // rechtsboven: muziek aan of uit
  const x = W - 46, y = 8;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; rrect(x, y, 38, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(x + 13, y + 26, 5, 4, -0.4, 0, 7); ctx.ellipse(x + 26, y + 23, 5, 4, -0.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 17, y + 25); ctx.lineTo(x + 17, y + 10); ctx.lineTo(x + 30, y + 7); ctx.lineTo(x + 30, y + 22); ctx.stroke();
  if (!muziekAan) { ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x + 7, y + 7); ctx.lineTo(x + 31, y + 31); ctx.stroke(); }
  knoppen.push({ x: x - 4, y: y - 4, w: 46, h: 46, doe: wisselMuziek });
}

let bodyKleur = '';
function teken() {
  knoppen.length = 0;
  const wd = wereld();
  if (bodyKleur != fig.id) { bodyKleur = fig.id; document.body.style.background = wd.body || ''; }
  wd.achter();
  if (staat != 'menu') {
    for (const p of palen) {
      const boven = p.midden - p.gat / 2, onder = p.midden + p.gat / 2;
      wd.paal(p.x, -20, boven + 20, true, p.nr);
      wd.paal(p.x, onder, GROND - onder, false, p.nr);
      if (p.friet && !p.friet.weg) wd.bonus(p.x + PAAL / 2, p.friet.y + Math.sin(beeld * 0.1 + p.nr) * 3 + 8);
    }
  }
  wd.grond();
  if (staat == 'menu') { menu(); muziekKnop(); return; }
  if (vallend) wd.valt(vallend.x, vallend.y, vallend.r);
  for (const v of veren) veer(v.x, v.y, v.r);
  const zweef = staat == 'klaar' ? Math.sin(beeld * 0.08) * 8 : 0;
  let hoek = staat == 'klaar' ? 0 : Math.max(-0.45, Math.min(1.3, vogel.vy * 0.09));
  if (fig.id == 'hommel') hoek = staat == 'dood' ? doodT * 0.28 : staat == 'over' ? 0 : hoek * 0.6; // tolt naar beneden
  wd.held(vogel.x, vogel.y + zweef, hoek, staat == 'klaar' ? (beeld % 30 < 12 ? 12 - beeld % 30 : 0) : vogel.flapT, 1, staat == 'dood' || staat == 'over');
  if (staat == 'klaar') {
    tekst(fig.naam, W / 2, 120, 32, '#ffe14d');
    tekst('Tik om te fladderen!', W / 2, H * 0.6, 22);
    tekst('Vlieg tussen ' + fig.palen + ' door', W / 2, H * 0.6 + 32, 15);
    tekst('en pik onderweg wat ' + fig.bonus[1] + ' mee', W / 2, H * 0.6 + 54, 15);
    // handje dat tikt
    const t = (beeld % 60) < 10 ? 4 : 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W / 2, H * 0.6 + 100 + t, 12, 0, 7); ctx.fill();
    ctx.fillRect(W / 2 - 4, H * 0.6 + 76 + t, 8, 24);
  }
  if (wind && staat == 'spel') windStrepen();
  if (staat == 'spel' || staat == 'dood') scorebord();
  if (staat == 'over') eindscherm();
  muziekKnop();
}

// het plaatje voor de startpagina (fladderfeest.html#tegel)
function tegelPlaatje() {
  schuif = 120; beeld = 3;
  achtergrond();
  palen = [{ x: 380, midden: 150, gat: 140, nr: 12 }, { x: 545, midden: 175, gat: 130, nr: 13 }];
  for (const p of palen) { paal(p.x, -20, p.midden - p.gat / 2 + 20, true, p.nr); paal(p.x, p.midden + p.gat / 2, GROND - p.midden - p.gat / 2, false, p.nr); }
  grond();
  frietje(388, 170, 0); frietje(480, 255, 0.4);
  meeuw(250, 175, -0.25, 6, 2.6);
  kip(90, 300, 1.6); hommel(150, 270, 1.4);
  tekst('Fladderfeest', 200, 70, 54, '#ffe14d', 'center', '#1d3b57');
}

// ---------- de lus ----------
let acc = 0, vorige = performance.now();
function lus(nu) {
  requestAnimationFrame(lus);
  acc += Math.min(100, nu - vorige); vorige = nu;
  while (acc >= 1000 / 60) { stap(); acc -= 1000 / 60; }
  teken();
}
document.addEventListener('visibilitychange', () => { vorige = performance.now(); });
if (TEGEL) { document.querySelector('.terug').hidden = true; tegelPlaatje(); }
else { nieuwSpel(); staat = 'menu'; requestAnimationFrame(lus); }
window.__test = { get wind() { return wind; }, get muziek() { return { aan: muziekAan, speelt: mSpeelt, stap: mStap }; }, get staat() { return staat; }, get score() { return score; }, get vogel() { return vogel; }, get palen() { return palen; }, flap, stap, nieuwSpel };
</script>
