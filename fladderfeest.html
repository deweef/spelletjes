function snd(f, d, type = 'square', v = 0.05, slide = 0, delay = 0) {

function ruis(d, v, filter, freq, delay = 0) { // ruis voor drums en bekkens
  if (!ac) return;

let muziekAan = true; try { muziekAan = localStorage.getItem('fladderfeest_muziek') != '0'; } catch (e) {}
let mGain = null, mSpeelt = false, mStap = 0, mVolgende = 0;
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
let vervorming = null;
function gitaar() { // vervormer voor de rockgitaar
  if (!vervorming) {
    vervorming = ac.createWaveShaper(); const k = 60, c = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    vervorming.curve = c; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    vervorming.connect(lp).connect(mGain);
  }
  return vervorming;
}
function noot(m, t, d, type, v, naar) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(hz(m), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(v * 0.5, t + d * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(naar || mGain); o.start(t); o.stop(t + d + 0.03);
}
function drum(soort, t) {
  if (soort == 'kick') { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g).connect(mGain); o.start(t); o.stop(t + 0.2); return; }
  const d = soort == 'snare' ? 0.16 : 0.04, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * d), ac.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = b; f.type = soort == 'snare' ? 'bandpass' : 'highpass'; f.frequency.value = soort == 'snare' ? 1800 : 7000;
  g.gain.setValueAtTime(soort == 'snare' ? 0.22 : 0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  src.connect(f).connect(g).connect(mGain); src.start(t);
}
const achtste = () => 30 / (MUZIEK[fig.id].tempo + Math.min(40, score || 0) * 0.6); // sneller als het moeilijker wordt
function speelStap(i, t) {
  const mz = MUZIEK[fig.id], mel = mz.melodie, n = mel[i], d = achtste();
  if (n > 0) {
    let len = 1; while (mel[(i + len) % mel.length] == -1) len++;
    if (mz.stijl == 'accordeon') { noot(n, t, d * len * 0.92, 'sawtooth', 0.011); noot(n + 0.12, t, d * len * 0.92, 'sawtooth', 0.011); noot(n + 12, t, d * len * 0.9, 'square', 0.006); }
    else if (mz.stijl == 'synth') { noot(n, t, d * len * 0.9, 'square', 0.02); noot(n + 12.07, t, d * len * 0.6, 'sawtooth', 0.007); }
    else if (mz.stijl == 'speeldoos') { noot(n + 12, t, 0.7, 'sine', 0.06); noot(n + 24, t, 0.25, 'sine', 0.015); }
    else if (mz.stijl == 'wals') { noot(n, t, d * len * 0.9, 'square', 0.016); noot(n + 12, t, d * len * 0.85, 'sine', 0.03); noot(n + 19, t, d * len * 0.5, 'sine', 0.006); }
    else if (mz.stijl == 'rock') { noot(n, t, d * len * 0.95, 'sawtooth', 0.02, gitaar()); noot(n + 0.1, t, d * len * 0.95, 'square', 0.006); }
    else { noot(n, t, d * len * 0.95, 'square', 0.022); noot(n + 12, t, d * len * 0.6, 'triangle', 0.012); }
  }
  const maat = mz.maat || 8, ak = mz.akkoorden[Math.floor(i / maat) % mz.akkoorden.length], tel = i % maat;
  if (mz.stijl == 'accordeon') { // hoem op 1 en 4, akkoordjes ertussen
    if (tel == 0 || tel == 3) noot((tel ? ak[2] : ak[0]) - 12, t, d * 1.5, 'triangle', 0.09);
    if (tel == 1 || tel == 2 || tel == 4 || tel == 5) for (const a of ak) noot(a + 12, t, d * 0.6, 'sawtooth', 0.005);
    return;
  }
  if (mz.stijl == 'synth') { // pompende bas, snelle arpeggio's en een strak drumpje
    const rol = [ak[0], ak[1], ak[2], ak[1] + 12];
    noot(rol[tel % 4] + 24, t, d * 0.45, 'square', 0.012);
    noot((tel % 2 ? ak[0] + 12 : ak[0]) - 12, t, d * 0.8, 'sawtooth', 0.035);
    if (tel == 0 || tel == 4) drum('kick', t);
    if (tel == 2 || tel == 6) drum('snare', t);
    if (tel % 2) drum('hihat', t);
    return;
  }
  if (mz.stijl == 'speeldoos') { // gebroken akkoorden, zacht en hoog
    const rol = [ak[0], ak[1], ak[2], ak[1]];
    noot(rol[tel % 4] + 24, t, 0.5, 'sine', 0.025);
    if (tel == 0) noot(ak[0] + 12, t, 0.9, 'sine', 0.04);
    return;
  }
  if (mz.stijl == 'wals') { // hoem-pa-pa, met een orgelpijp-achtige melodie
    if (tel == 0) noot(ak[0] - 12, t, d * 1.8, 'triangle', 0.1);
    if (tel == 2 || tel == 4) for (const a of ak) noot(a + 12, t, d * 0.8, 'square', 0.007);
    return;
  }
  if (mz.stijl == 'rock') { // chug-chug powerchords, drums: kick op 1 en "en-3", snare op 2 en 4, hihat elke achtste
    const g = gitaar(), w = ak[0], accent = tel == 0 || tel == 3 || tel == 6;
    for (const iv of [0, 7, 12]) noot(w + iv, t, d * (accent ? 1.6 : 0.55), 'sawtooth', accent ? 0.05 : 0.03, g);
    if (tel == 0 || tel == 3 || tel == 4) drum('kick', t);
    if (tel == 2 || tel == 6) drum('snare', t);
    drum('hihat', t);
    return;
  }
  if (mz.stijl == 'banjo') { // getokkel op elke achtste, bas op 1 en 3
    const rol = [ak[0], ak[1], ak[2], ak[0] + 12, ak[2], ak[1], ak[2], ak[0] + 12];
    noot(rol[tel] + 12, t, d * 0.5, 'square', 0.009); noot(rol[tel] + 24, t, d * 0.3, 'triangle', 0.01);
    if (tel == 0 || tel == 4) noot((tel ? ak[2] : ak[0]) - 12, t, d * 1.4, 'triangle', 0.09);
    return;
  }
  if (tel == 0) noot(ak[0] - 12, t, d * 1.6, 'triangle', 0.09); // hoem
  if (tel == 4) noot(ak[2] - 12, t, d * 1.6, 'triangle', 0.08);
  if (tel == 2 || tel == 6) for (const a of ak) noot(a + 12, t, d * 0.7, 'square', 0.008); // pa
}
setInterval(() => {
  if (!mSpeelt || !ac) return;
  if (mVolgende < ac.currentTime) mVolgende = ac.currentTime + 0.02;
  while (mVolgende < ac.currentTime + 0.15) { speelStap(mStap, mVolgende); mVolgende += achtste(); mStap = (mStap + 1) % MUZIEK[fig.id].melodie.length; }
}, 25);
function startMuziek() {
  if (!ac || !muziekAan || !MUZIEK[fig.id] || document.hidden) return;
  if (!mGain) { mGain = ac.createGain(); mGain.connect(ac.destination); }
  mGain.gain.cancelScheduledValues(ac.currentTime); mGain.gain.setValueAtTime(1, ac.currentTime);
  if (mSpeelt) return;
  mSpeelt = true; mStap = 0; mVolgende = ac.currentTime + 0.05;
}
function stopMuziek(woe) {
  if (!mSpeelt || !ac) { mSpeelt = false; return; }
  mSpeelt = false;
  mGain.gain.cancelScheduledValues(ac.currentTime); mGain.gain.setValueAtTime(mGain.gain.value, ac.currentTime); mGain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.25);
  if (woe) { // woeoeoe: de muziek zakt in elkaar
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'triangle'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.9);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 7; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
    o.connect(g).connect(ac.destination); o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
  }
}
function zorgMuziek() { if (staat == 'menu' || staat == 'klaar' || staat == 'spel' || staat == 'finish') startMuziek(); }
function wisselMuziek() {
  muziekAan = !muziekAan; try { localStorage.setItem('fladderfeest_muziek', muziekAan ? '1' : '0'); } catch (e) {}
  if (muziekAan) { unlock(); zorgMuziek(); } else stopMuziek(false);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopMuziek(false); else zorgMuziek(); });

// ---------- spelstatus ----------
let staat = 'menu'; // menu, klaar (wacht op eerste tik), spel, dood, over

let vrijgespeeld = null, veren = [], juich = 0, wind = null, volgendeWind = 0;
function startTocht() { stopMuziek(false); tocht = { i: 0, totaal: 0, levens: 0, volgendLeven: 25 }; fig = FIGUREN[0]; nieuwSpel(); }
function nieuwSpel() {
  vrijgespeeld = null; finish = null; onkw = 0; melding = null; vuurwerk = [];
  veren = [];

// gat tussen de palen: in het begin ruim, langzaam krapper
const gat = () => Math.max(132, 178 - score * 1.1) + (fig.ruimer || 0);
function nieuwePaal(x) {
  const g = gat();

  const marge = 70 + amp;

// ---------- invoer ----------
function naarSpel(x, y) { return { x: (x - cv.getBoundingClientRect().left) / cv.getBoundingClientRect().width * W, y: (y - cv.getBoundingClientRect().top) / cv.getBoundingClientRect().height * H }; }

    else if (staat == 'menu') { tocht = null; fig = FIGUREN[0]; nieuwSpel(); }

// ---------- spelregels (60 keer per seconde) ----------
function botst(cx, cy, r, x, y, w, h) {
  const nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
const PAAL = 56, STRAAL = 12;

function stap() {
  beeld++; if (juich > 0) juich--;
  if (melding && --melding.t <= 0) melding = null;
  for (const v of vuurwerk) { v.x += v.vx; v.y += v.vy; v.vy += 0.04; v.vx *= 0.98; v.l--; }
  vuurwerk = vuurwerk.filter((v) => v.l > 0);
  if (staat == 'menu' || staat == 'klaar') { schuif += 1.2; return; }
  if (staat == 'finish') { // vrij vliegen door de finish, met vuurwerk; daarna het volgende dier
    schuif += snelheid; doodT++;

    if (finish) finish.x -= snelheid;
    vogel.vy += (H * 0.4 - vogel.y) * 0.004 - vogel.vy * 0.05; vogel.y += vogel.vy; vogel.flapT = beeld % 24 < 12 ? 12 - beeld % 24 : 0;
    if (doodT > 170) volgendeEtappe();

  }
  if (staat == 'spel') {
    if (onkw > 0) onkw--;
    schuif += snelheid;
    vogel.vy = Math.min(fig.max, vogel.vy + fig.zwaarte);
    if (fig.wind && strekenAan()) { // windvlagen: eerst een waarschuwing, dan anderhalve seconde duwen
      if (!wind && --volgendeWind <= 0) { wind = { t: 0, op: Math.random() < 0.5 ? -1 : 1 }; sWind(); }
      if (wind) {
        wind.t++;
        if (wind.t > 45) vogel.vy += wind.op * 0.11;
        if (wind.t > 45 + 90) { wind = null; volgendeWind = 60 * (6 + Math.random() * 5); }
      }

    vogel.y += vogel.vy;

    if (vogel.stuw > 0) { vogel.vy -= fig.stuwKracht; vogel.stuw--; }
    if (vogel.y < 10) { vogel.y = 10; vogel.vy = Math.max(0, vogel.vy); }
    for (const p of palen) {
      p.x -= snelheid;
      if (p.amp) { p.midden = p.basis + Math.sin(fig.id == 'kraai' ? beeld * 0.105 : beeld * 0.03 + p.fase) * p.amp; if (p.friet) p.friet.y = p.midden + p.friet.dy; }
      if (!p.voorbij && p.x + PAAL < vogel.x) { p.voorbij = true; score++; sPunt(); juich = 24; extraLeven(); snelheid = Math.min(3.3, 2.3 + score * 0.025); }
      if (p.friet && !p.friet.weg && Math.hypot(p.x + PAAL / 2 - vogel.x, p.friet.y - vogel.y) < 22) { p.friet.weg = true; frietjes++; score++; sHap(); extraLeven(); if (fig.id == 'pinguin') brandstof = Math.min(100, brandstof + 40); }
      const boven = p.midden - p.gat / 2, onder = p.midden + p.gat / 2;

      if (onkw <= 0 && (botst(vogel.x, vogel.y, STRAAL, p.x, -50, PAAL, boven + 50) || botst(vogel.x, vogel.y, STRAAL, p.x, onder, PAAL, 34) || botst(vogel.x, vogel.y, STRAAL, p.x + ins, onder + 34, PAAL - 2 * ins, GROND - onder))) return geraakt();
    }

    }
  } else if (staat == 'dood' || staat == 'over') {
    doodT++;
    if (vogel.y + STRAAL < GROND) { vogel.vy = Math.min(10, vogel.vy + 0.5); vogel.y = Math.min(GROND - STRAAL, vogel.y + vogel.vy); }
    if (vallend) { vallend.vy += 0.3; vallend.y = Math.min(GROND - 4, vallend.y + vallend.vy); if (fig.id != 'kip') vallend.r += 0.15; }
    for (const v of veren) { v.x += v.vx; v.y += v.vy; v.vy = Math.min(0.8, v.vy + 0.08); v.vx *= 0.97; v.r += 0.05; v.l--; }

    }
  }
}

// de streken per dier; geeft geraakt() terug als de vogel iets raakt
function strekenStap() {
  if (fig.id == 'pinguin') brandstof = Math.min(100, brandstof + 0.12);
  if (!strekenAan()) return;
  for (const g of gevaren) { g.t++; if (g.t > g.wacht) g.x += g.vx; }
  gevaren = gevaren.filter((g) => g.x > -40);
  if (onkw <= 0) for (const g of gevaren) if (g.t > g.wacht && Math.hypot(g.x - vogel.x, g.y - vogel.y) < g.r + STRAAL - 2) { g.x = -99; return geraakt(); }
  if (bui) { bui.t++; if (bui.t > 260) bui = null; }
  if (--volgendeStreek > 0) return;
  volgendeStreek = 60 * (5 + Math.random() * 4);
  const y = 80 + Math.random() * (GROND - 160);
  if (fig.id == 'meeuw') { gevaren.push({ soort: 'dief', x: W + 30, y, vx: -(snelheid + 2.4), r: 12, t: 0, wacht: 60 }); meld('Patatdief!', '#fff'); }
  if (fig.id == 'papegaai') { gevaren.push({ soort: 'kogel', x: W + 20, y, vx: -(snelheid + 3.6), r: 9, t: 0, wacht: 60 }); }

function meld(tekst, kleur = '#ffe14d') { melding = { tekst, kleur, t: 100 }; }
function extraLeven() {

// geraakt: in de tocht kost dat een extra vogeltje (als je er een hebt), anders is het afgelopen
function geraakt() {
  if (!tocht || tocht.levens <= 0) return dood();
  tocht.levens--; onkw = 100; sBots(); meld('Vogeltje kwijt! Nog ' + tocht.levens + ' over', '#ff9a8a');

  vogel.y = p ? p.midden : H * 0.42; vogel.vy = 0;
}
function finishBereikt() {
  finish.voorbij = true; staat = 'finish'; doodT = 0; sMedaille(); setTimeout(sMedaille, 400);
  const i = tocht.i, volgende = FIGUREN[i + 1], wasDicht = !open(i + 1);
  if (score > record(fig.id)) zetRecord(fig.id, score); // een finish telt ook als record, en speelt het volgende dier vrij
  meld(wasDicht && open(i + 1) ? 'Vrijgespeeld: ' + volgende.naam + '!' : 'Finish!');

}
function knal(x, y) {
  const kl = ['#ff3c78', '#ffe14d', '#50c8ff', '#7dff7a', '#ff9a2a', '#c080ff'][Math.floor(Math.random() * 6)];
  for (let i = 0; i < 26; i++) { const a = Math.random() * 7, v = 1 + Math.random() * 3; vuurwerk.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 60 + Math.random() * 30, kl }); }

}
function volgendeEtappe() {
  tocht.totaal += score; tocht.i++;
  stopMuziek(false); fig = FIGUREN[tocht.i]; nieuwSpel();
}

function dood() {
  staat = 'dood'; doodT = 0; sBots(); setTimeout({ kip: sKakel, kraai: sKraa, hommel: sBrom, roodborst: sPiep, papegaai: sKraak, pinguin: sSputter }[fig.id] || sKrijs, 150); stopMuziek(fig.id != 'kraai');
  vogel.vy = -5;
  vallend = fig.id == 'kip' ? { x: vogel.x - 6, y: vogel.y + 8, vy: 0, r: 0 } // van schrik een ei
    : fig.id == 'papegaai' || fig.id == 'pinguin' ? { x: vogel.x + 10, y: vogel.y, vy: -3, r: 0 } // goudstuk of visje vliegt weg
    : fig.id == 'roodborst' ? { x: vogel.x + 10, y: vogel.y + 4, vy: -2, r: 0 } // een besje rolt weg
    : fig.id == 'hommel' ? { x: vogel.x + 4, y: vogel.y + 6, vy: 0, r: 0 } // zijn nectar druppelt eruit
    : fig.id == 'kraai' ? { x: vogel.x + 12, y: vogel.y - 8, vy: -4, r: 0 } // zijn zonnebril vliegt eraf
    : { x: vogel.x + 14, y: vogel.y, vy: -3, r: 0 }; // het frietje valt uit zijn snavel
  if (fig.id == 'kip') for (let i = 0; i < 9; i++) veren.push({ x: vogel.x, y: vogel.y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, r: Math.random() * 6, l: 90 });

}

// ---------- tekenen ----------
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function tekst(t, x, y, grootte, kleur = '#fff', uitlijn = 'center', rand = '#1d3b57') {
  ctx.font = `bold ${grootte}px "Trebuchet MS", Verdana, sans-serif`; ctx.textAlign = uitlijn; ctx.textBaseline = 'middle';
  if (rand) { ctx.lineWidth = Math.max(3, grootte / 6); ctx.strokeStyle = rand; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = kleur; ctx.fillText(t, x, y);
}

function wolk(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(x, y, 16 * s, 0, 7); ctx.arc(x + 18 * s, y - 8 * s, 20 * s, 0, 7); ctx.arc(x + 40 * s, y, 15 * s, 0, 7); ctx.rect(x, y - 2 * s, 40 * s, 17 * s); ctx.fill();
}

function strandhuisje(x, y, kleur) {
  ctx.fillStyle = kleur; ctx.fillRect(x, y - 30, 30, 30);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) ctx.fillRect(x + 4 + i * 9, y - 30, 4, 30);
  ctx.fillStyle = '#7a4a2a'; ctx.beginPath(); ctx.moveTo(x - 4, y - 30); ctx.lineTo(x + 15, y - 44); ctx.lineTo(x + 34, y - 30); ctx.fill();
  ctx.fillStyle = '#5a3a20'; ctx.fillRect(x + 11, y - 16, 8, 16);
}

function achtergrond() {
  const horizon = GROND - 120;

  lucht.addColorStop(0, '#5fb8e8'); lucht.addColorStop(1, '#c9ecff');
  ctx.fillStyle = lucht; ctx.fillRect(0, 0, W, horizon + 2);
  ctx.fillStyle = '#ffe58a'; ctx.beginPath(); ctx.arc(W - 70, 80, 30, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,229,138,.35)'; ctx.beginPath(); ctx.arc(W - 70, 80, 42, 0, 7); ctx.fill();
  for (let i = 0; i < 4; i++) { const x = ((i * 170 - schuif * 0.15) % (W + 200) + W + 200) % (W + 200) - 100; wolk(x, 60 + (i * 53) % 130, 0.8 + (i % 2) * 0.4); }
  // zee met golfjes en een bootje
  const zee = ctx.createLinearGradient(0, horizon, 0, GROND - 40);

    g.addColorStop(0, 'rgba(240,245,255,0)'); g.addColorStop(1, `rgba(240,245,255,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = `rgba(255,255,255,${a})`; for (let i = 0; i < 80; i++) { const x = ((i * 53 - beeld * 3) % W + W) % W, y = (i * 97 + beeld * 4) % H; ctx.fillRect(x, y, 2.5, 2.5); }
  }
  if (streken && fig.id == 'pinguin' && (staat == 'spel' || staat == 'klaar')) { // brandstofmeter
    ctx.fillStyle = 'rgba(0,0,0,.35)'; rrect(12, 200, 16, 140, 6); ctx.fill();
    const h = 136 * brandstof / 100; ctx.fillStyle = brandstof < 25 ? (beeld % 20 < 10 ? '#ff3c3c' : '#ff9a2a') : '#ffb43a'; rrect(14, 338 - h, 12, h, 4); ctx.fill();
    tekst('⛽', 20, 352, 14, '#fff', 'center', null);
  }
}

// de finish: twee palen met een geblokte vlag ertussen en een geblokte streep
function finishVlag(x) {
  ctx.fillStyle = '#ddd'; ctx.fillRect(x - 4, 40, 6, GROND - 40); ctx.fillRect(x + 34, 40, 6, GROND - 40);
  for (let k = 0; k < 6; k++) for (let j = 0; j < 3; j++) { ctx.fillStyle = (k + j) % 2 ? '#fff' : '#222'; ctx.fillRect(x + 2 + k * 5.4, 40 + j * 7 + Math.sin(beeld * 0.15 + k * 0.6) * 2, 5.4, 7); }
  ctx.globalAlpha = 0.35; for (let j = 0; j * 12 < GROND - 64; j++) { ctx.fillStyle = j % 2 ? '#fff' : '#222'; ctx.fillRect(x + 14, 64 + j * 12, 8, 12); } ctx.globalAlpha = 1;
  tekst('FINISH', x + 18, 32, 14, '#ffe14d', 'center', '#c0392b');
}

function muziekKnop() { // rechtsboven: muziek aan of uit
  const x = W - 46, y = 8;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; rrect(x, y, 38, 38, 19); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(x + 13, y + 26, 5, 4, -0.4, 0, 7); ctx.ellipse(x + 26, y + 23, 5, 4, -0.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 17, y + 25); ctx.lineTo(x + 17, y + 10); ctx.lineTo(x + 30, y + 7); ctx.lineTo(x + 30, y + 22); ctx.stroke();
  if (!muziekAan) { ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x + 7, y + 7); ctx.lineTo(x + 31, y + 31); ctx.stroke(); }
  knoppen.push({ x: x - 4, y: y - 4, w: 46, h: 46, doe: wisselMuziek });
}

let bodyKleur = '';
function teken() {
  knoppen.length = 0;
  const wd = wereld();
  if (bodyKleur != fig.id) { bodyKleur = fig.id; document.body.style.background = wd.body || ''; }
  wd.achter();
  if (staat != 'menu') {
    for (const p of palen) {
      const boven = p.midden - p.gat / 2, onder = p.midden + p.gat / 2;
      wd.paal(p.x, -20, boven + 20, true, p.nr);
      wd.paal(p.x, onder, GROND - onder, false, p.nr);
      if (p.friet && !p.friet.weg) wd.bonus(p.x + PAAL / 2, p.friet.y + Math.sin(beeld * 0.1 + p.nr) * 3 + 8);
    }
  }
  if (finish && staat != 'menu') finishVlag(finish.x);
  wd.grond();
  if (staat == 'menu') { menu(); muziekKnop(); return; }
  if (vallend) wd.valt(vallend.x, vallend.y, vallend.r);
  for (const v of veren) veer(v.x, v.y, v.r);
  const zweef = staat == 'klaar' ? Math.sin(beeld * 0.08) * 8 : 0;
  let hoek = staat == 'klaar' ? 0 : Math.max(-0.45, Math.min(1.3, vogel.vy * 0.09));
  if (fig.id == 'hommel') hoek = staat == 'dood' ? doodT * 0.28 : staat == 'over' ? 0 : hoek * 0.6; // tolt naar beneden
  if (!(onkw > 0 && beeld % 8 < 4)) wd.held(vogel.x, vogel.y + zweef, hoek, staat == 'klaar' ? (beeld % 30 < 12 ? 12 - beeld % 30 : 0) : vogel.flapT, 1, staat == 'dood' || staat == 'over');
  if (staat == 'klaar' && tocht) {
    tekst('Grote tocht · dier ' + (tocht.i + 1) + ' van ' + FIGUREN.length, W / 2, 104, 16, '#fff');
    if (tocht.totaal) tekst('Totaal tot nu toe: ' + tocht.totaal, W / 2, 168, 15, '#fff');
  }
  if (staat == 'klaar') {
    tekst(fig.naam, W / 2, 134, 32, '#ffe14d');
    if (tocht) tekst(doelTocht() ? 'Finish bij ' + doelTocht() + ' punten' : 'Laatste dier: vlieg zo ver als je kunt!', W / 2, H * 0.6 - 30, 16, '#ffe14d');
    tekst('Tik om te fladderen!', W / 2, H * 0.6, 22);
    tekst('Vlieg tussen ' + fig.palen + ' door', W / 2, H * 0.6 + 32, 15);
    tekst('en pik onderweg wat ' + fig.bonus[1] + ' mee', W / 2, H * 0.6 + 54, 15);
    if (streken) tekst(STREEK[fig.id] + ' (vanaf 3 punten)', W / 2, H * 0.6 + 140, 14, '#ffb4a8', 'center', '#1d3b57');
    // handje dat tikt
    const t = (beeld % 60) < 10 ? 4 : 0;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W / 2, H * 0.6 + 100 + t, 12, 0, 7); ctx.fill();
    ctx.fillRect(W / 2 - 4, H * 0.6 + 76 + t, 8, 24);
  }
  if (wind && staat == 'spel') windStrepen();
  if (staat != 'menu') tekenStreken();
  if (staat == 'spel' || staat == 'dood' || staat == 'finish') scorebord();
  for (const v of vuurwerk) { ctx.globalAlpha = Math.min(1, v.l / 30); ctx.fillStyle = v.kl; ctx.fillRect(v.x - 1.5, v.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  if (staat == 'finish') { tekst('FINISH!', W / 2, H * 0.3, 44, '#ffe14d', 'center', '#c0392b'); if (doodT > 60) tekst('Op naar: ' + FIGUREN[tocht.i + 1].naam, W / 2, H * 0.3 + 46, 18, '#fff'); }
  if (melding && staat != 'over') { ctx.globalAlpha = Math.min(1, melding.t / 20); tekst(melding.tekst, W / 2, staat == 'finish' ? H * 0.3 + 80 : 186, 18, melding.kleur, 'center', '#1d3b57'); ctx.globalAlpha = 1; }
  if (staat == 'over') eindscherm();
  muziekKnop();
}

// het plaatje voor de startpagina (fladderfeest.html#tegel)
function tegelPlaatje() {
  schuif = 120; beeld = 3;
  achtergrond();
  palen = [{ x: 380, midden: 150, gat: 140, nr: 12 }, { x: 545, midden: 175, gat: 130, nr: 13 }];
  for (const p of palen) { paal(p.x, -20, p.midden - p.gat / 2 + 20, true, p.nr); paal(p.x, p.midden + p.gat / 2, GROND - p.midden - p.gat / 2, false, p.nr); }
  grond();
  frietje(388, 170, 0); frietje(480, 255, 0.4);
  meeuw(250, 175, -0.25, 6, 2.6);
  kip(90, 300, 1.6); hommel(150, 270, 1.4);

}

// ---------- de lus ----------
let acc = 0, vorige = performance.now();
function lus(nu) {
  requestAnimationFrame(lus);
  acc += Math.min(100, nu - vorige); vorige = nu;
  while (acc >= 1000 / 60) { stap(); acc -= 1000 / 60; }
  teken();
}
document.addEventListener('visibilitychange', () => { vorige = performance.now(); });
if (TEGEL) { document.querySelector('.terug').hidden = true; tegelPlaatje(); }
else { nieuwSpel(); staat = 'menu'; requestAnimationFrame(lus); }
window.__test = { get gevaren() { return gevaren; }, get bui() { return bui; }, get brandstof() { return brandstof; }, get tocht() { return tocht; }, get finish() { return finish; }, startTocht, get wind() { return wind; }, get muziek() { return { aan: muziekAan, speelt: mSpeelt, stap: mStap }; }, get staat() { return staat; }, get score() { return score; }, get vogel() { return vogel; }, get palen() { return palen; }, flap, stap, nieuwSpel };
