<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Koekjesschuiver 3D</title>
<style>
:root{--room:#fff4dc;--rood:#b8232f;--goud:#f2c230;--rand:rgba(255,244,220,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3a0e12;color:var(--room);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#wereld{position:fixed;inset:0}
#wereld canvas{display:block}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.terug{position:fixed;z-index:60;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid var(--rand);color:var(--room);font:bold 20px/30px Georgia,serif;text-align:center;text-decoration:none}
.terug:focus-visible,button:focus-visible{outline:2px solid var(--room);outline-offset:2px}
#balk{position:fixed;top:8px;left:52px;right:8px;display:flex;align-items:center;gap:10px;z-index:20;pointer-events:none}
#balk h1{font:bold 22px Georgia,serif;margin:0 auto 0 0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#balk .tel{background:rgba(40,0,10,.55);border:1px solid var(--rand);border-radius:12px;padding:5px 12px;text-align:center;line-height:1.05}
#balk .tel b{display:block;font:bold 20px Georgia,serif;color:#fff}
#balk .tel small{font-size:11px;opacity:.85}
#balk button{pointer-events:auto;background:var(--goud);color:#5a1a10;border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}
#balk button.stil{background:rgba(40,0,10,.6);color:var(--room);border:1px solid var(--rand)}
#krachten{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
#krachten button{width:96px;background:rgba(60,8,14,.82);border:1.5px solid var(--rand);border-radius:12px;padding:6px 4px;font-size:12px;font-weight:700;line-height:1.2}
#krachten button.klaar{border-color:var(--goud);box-shadow:0 0 0 2px var(--goud) inset;animation:gloei 1s infinite alternate}
@keyframes gloei{to{background:rgba(120,30,20,.9)}}
#krachten button i{display:block;font-style:normal;letter-spacing:3px;color:var(--goud);font-size:13px}
#krachten button small{display:block;font-weight:500;opacity:.8;font-size:10.5px}
#pops{position:fixed;inset:0;pointer-events:none;z-index:30}
.pop{position:absolute;transform:translate(-50%,-50%);font:bold 22px Georgia,serif;color:#fff4dc;text-shadow:0 2px 3px rgba(40,0,10,.8);white-space:nowrap;animation:op 1.1s ease-out forwards}
.pop.goud{color:#ffe07a}.pop.weg{color:#ffb3a8;font-size:15px}
@keyframes op{to{transform:translate(-50%,-160%);opacity:0}}
.roep{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);background:#fff4dc;color:var(--rood);border:3px solid var(--rood);border-radius:24px;padding:8px 22px;font:bold 30px Georgia,serif;animation:roep 2.2s ease-out forwards}
@keyframes roep{0%{transform:translate(-50%,-50%) scale(.3)}12%{transform:translate(-50%,-50%) scale(1.15)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff4dc;color:#5a1a10;border:3px solid var(--goud);border-radius:16px;padding:10px 18px;z-index:40;font-weight:700;text-align:center}
#toast b{display:block;font:bold 20px Georgia,serif}
.scherm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,0,10,.6);z-index:50;padding:16px}
.kaart{background:#5a1a10;border:2px solid var(--goud);border-radius:18px;padding:18px 22px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center}
.kaart h2{font:bold 26px Georgia,serif;margin:0 0 6px}
#badgelijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0;text-align:left}
#badgelijst div{background:rgba(255,244,220,.08);border-radius:10px;padding:8px 10px;font-size:13px}
#badgelijst div.niet{opacity:.45}
#badgelijst b{display:block;font-size:14px}
.groot{display:block;width:100%;margin:8px 0;padding:11px;border-radius:12px;border:0;background:var(--goud);color:#5a1a10;font-weight:800;font-size:16px}
#tip{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.9;z-index:20;text-shadow:0 1px 2px #000;text-align:center}
#laden{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:bold 22px Georgia,serif;z-index:70;background:#3a0e12}
.tegel #balk,.tegel #krachten,.tegel #tip,.tegel .terug{display:none!important}
@media (max-width:620px){#krachten button{width:62px;font-size:10.5px}#krachten button small{display:none}#balk h1{display:none}}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","cannon":"./lib/cannon-es.js"}}</script>
</head>
<body>
<a class="terug" href="../" aria-label="Terug naar de spellen">‹</a>
<div id="wereld"></div>
<div id="laden">Koekjes bakken…</div>
<div id="balk">
  <h1>Koekjesschuiver 3D</h1>
  <div class="tel"><b id="voorraad">40</b><small>koekjes over</small></div>
  <div class="tel"><b id="punten">0</b><small>punten</small></div>
  <button id="badgeknop">Badges 0/15</button>
  <button id="nieuwknop" class="stil">Nieuw</button>
</div>
<div id="krachten"></div>
<div id="tip">Klik of tik boven de schuif om een koekje te laten vallen · spatie = laten vallen</div>
<div id="pops"></div>
<div id="toast" hidden></div>
<div id="badges" class="scherm" hidden>
  <div class="kaart">
    <h2>Koekie-badges</h2>
    <p id="badgetel"></p>
    <div id="badgelijst"></div>
    <button id="badgesdicht" class="groot">Sluiten</button>
  </div>
</div>
<script type="module" src="js/spel.js"></script>
</body>
</html>
