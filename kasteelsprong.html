<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kasteelsprong</title>
<style>
html,body{margin:0;height:100%;background:#0d1230;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:12px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none}
.grp{display:flex;gap:14px}
.b{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,220,150,.35);color:#ffe2a8;font:bold 26px Georgia,serif;display:flex;align-items:center;justify-content:center}
.b.on{background:rgba(245,180,80,.45)}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
.pauze{position:fixed;z-index:10;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,226,168,.45);color:#ffe2a8;font:bold 15px system-ui,sans-serif;padding:0}
.terug{position:fixed;z-index:10;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,226,168,.45);color:#ffe2a8;font:bold 22px/34px Georgia,serif;text-align:center;text-decoration:none;-webkit-tap-highlight-color:transparent}
.terug:focus-visible{outline:2px solid #ffe2a8;outline-offset:2px}
canvas,.b,button{touch-action:none}
</style>
</head>
<body>
<a class="terug" href="./" aria-label="Terug naar de spellen">‹</a>
<div id="wrap"><canvas id="c" width="800" height="450"></canvas></div>
<button class="pauze" id="pz" aria-label="Pauze">II</button>
<div id="pad">
  <div class="grp"><div class="b" data-k="l">◀</div><div class="b" data-k="r">▶</div></div>
  <div class="grp"><div class="b" data-k="d">▼</div><div class="b" data-k="j">▲</div></div>
</div>
<script>
const W=800,H=450,G=330;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

// ---------- invoer ----------
const keys={l:0,r:0,d:0,j:0};let jumpPressed=false;
const map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowDown:'d',KeyS:'d',Space:'j',ArrowUp:'j',KeyW:'j',Enter:'j'};
addEventListener('keydown',e=>{if(e.code=='KeyP'||e.code=='Escape'){togglePause();return}if(paused){if(e.code=='Space'){e.preventDefault();togglePause()}return}const k=map[e.code];if(!k)return;e.preventDefault();unlock();if(k=='j'&&!e.repeat)jumpPressed=true;keys[k]=1});
addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=0});
document.querySelectorAll('.b').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();unlock();keys[k]=1;if(k=='j')jumpPressed=true;b.classList.add('on')};
  const off=e=>{e.preventDefault();keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off));
});
document.getElementById('pz').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlock();togglePause()});
cv.addEventListener('pointerdown',()=>{if(paused){togglePause();return}if(state=='title'||state=='over'||state=='song'){unlock();jumpPressed=true}});

// ---------- geluid ----------
let ac=null;function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!='running')ac.resume();if(!ac._ok){const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);ac._ok=1}}catch(e){}}
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,unlock,{passive:true}));
// geen inzoomen bij dubbeltikken
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
{let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<400&&e.cancelable)e.preventDefault();lt=n},{passive:false})}
function snd(f,d,type='square',v=.06,slide=0){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function bell(){[523,784,1047,1568].forEach((f,i)=>snd(f,1.8-i*.3,'sine',.12/(i+1)))}

// Teddy Bears' Picnic (John W. Bratton, 1907, publiek domein): eerste deel, 6/8, in achtsten
const NOTE={E4:64,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,G5:79,A5:81};
const MEL=[['E4',3],
 ['A4',2],['C5',1],['B4',1],['C5',1],['B4',1], ['A4',2],['C5',1],['B4',2],['C5',1],
 ['A4',1],['B4',1],['C5',1],['B4',2],['C5',1], ['A4',5],['G4',1],
 ['C5',2],['E5',1],['D5',1],['E5',1],['D5',1], ['C5',2],['E5',1],['D5',2],['E5',1],
 ['C5',1],['D5',1],['E5',1],['D5',2],['E5',1], ['C5',5],['G5',1],
 ['A5',2],['G5',1],['A5',2],['G5',1], ['D5',1],['E5',1],['G5',1],['E5',2],['D5',1],
 ['D5',2],['C5',1],['D5',2],['C5',1], ['G4',1],['A4',1],['C5',1],['A4',2],['G4',1],
 ['A4',2],['C5',1],['G4',2],['G4',1], ['A4',1],['B4',1],['C5',1],['G4',2],['E5',1],
 ['D5',6],['C5',3]];
const BASS=[40,45,40,45,40,45,40,45,43,48,43,48,43,48,43,48,48,43,43,43,43,48,48,48,48,41,48,41,48,43,43,48];
const EIGHTH=.19,SONG_FRAMES=Math.round(96*EIGHTH*60);
let songNodes=[];
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,s,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.setValueAtTime(v,s+d*.6);g.gain.exponentialRampToValueAtTime(.001,s+d);
 o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.02);songNodes.push(o)}
function playSong(){if(!ac)return;stopSong();try{const t0=ac.currentTime+.06;let tt=t0;
 for(const [n,d] of MEL){tone(mf(NOTE[n]),tt,d*EIGHTH*.9,'square',.04);tt+=d*EIGHTH}
 tt=t0;for(const m of BASS){tone(mf(m+12),tt,3*EIGHTH*.75,'triangle',.12);tt+=3*EIGHTH}}catch(e){}}
function stopSong(){for(const o of songNodes){try{o.stop()}catch(e){}try{o.disconnect()}catch(e){}}songNodes=[]}

// ---------- levels ----------
// rocks:[x]  pits:[x,breedte,touw?]  pikes:[x,periode,offset]
// arrows: p = 'L' laag (springen) / 'H' hoog (bukken) van rechts, kleine letter = van achteren; first = frames na "Start!"
// balls:  p = 'b' stenen kogel / 'f' vuurbal, rollen van rechts
const LEVELS=[
 {name:'De eerste kantelen',rocks:[330,540]},
 {name:'Rollende kogels',balls:{p:'b',i:210}},
 {name:'Het gat in de muur',pits:[[340,80]]},
 {name:'Pijlenregen',rocks:[430],arrows:{p:'L',i:120}},
 {name:'Het eerste touw',pits:[[300,180,1]]},
 {name:'Kijk achter je!',arrows:{p:'lHL',i:130,first:12},rocks:[520]},
 {name:'Bukken!',arrows:{p:'HHLH',i:100},pits:[[520,80]]},
 {name:'Vuurballen',balls:{p:'fbf',i:170},pikes:[[420,140,40]]},
 {name:'De wachters',pikes:[[300,130,0],[560,130,65,'bier']],rocks:[430]},
 {name:'Wachters op de muur',pikes:[[190,120,0],[380,120,40,'bier'],[570,120,80]]},
 {name:'Touw en pijl',pits:[[330,180,1]],arrows:{p:'H',i:170},rocks:[620]},
 {name:'Dubbel touw',pits:[[200,170,1],[480,170,1]]},
 {name:'Vuur van voren, pijl van achter',balls:{p:'f',i:230},arrows:{p:'hl',i:190,first:12}},
 {name:'De laatste toren',rocks:[150],pikes:[[300,120,30]],pits:[[430,180,1]],arrows:{p:'lH',i:130}},
];

// ---------- decor ----------
const stars=[...Array(90)].map(()=>({x:Math.random()*W,y:Math.random()*(G-60),r:Math.random()*1.4+.3,p:Math.random()*6}));
const towers=[[40,150,50],[130,210,36],[250,120,60],[470,190,44],[590,140,54],[700,220,40]];

// ---------- toestand ----------
let state='title',lvl=0,round=0,lives=5,score=0,hi=0,t=0,gt=0,lt=0,stTimer=0,msg='',bellSwing=0,streak=0,goTimer=0,roundMsg=0,songF=0;
let L,p,ip,arrows=[],balls=[],arrowTimer=0,arrowIdx=0,ballTimer=0,ballIdx=0,parts=[];
try{hi=+localStorage.getItem('kasteelsprong_hi')||0}catch(e){}
const spd=()=>1+.18*round;

function mkRope(x,w){const len=152;return{ax:x+w/2,ay:130,len,A:Math.asin(Math.min(.92,(w/2+12)/len)),ph:Math.random()*6.28}}
const ropeW=()=>.044*spd();
const ropeTh=r=>r.A*Math.sin(t*ropeW()+r.ph);
const ropeDTh=r=>r.A*ropeW()*Math.cos(t*ropeW()+r.ph);

function loadLevel(){
 const d=LEVELS[lvl];
 L={name:d.name,rocks:(d.rocks||[]).map(x=>({x})),pits:(d.pits||[]).map(([x,w,r])=>({x,w,rope:r?mkRope(x,w):null})),
    pikes:(d.pikes||[]).map(([x,per,off,b])=>({x,per,off,beer:b=='bier',mode:'down',tm:60,h:0,hik:0})),arrows:d.arrows||null,balls:d.balls||null};
 for(const k of L.pikes)L.pits.push({x:k.x-12,w:30,rope:null,guard:1});
 arrows=[];balls=[];arrowIdx=0;ballIdx=0;lt=0;parts=[];
 arrowTimer=L.arrows&&L.arrows.first?L.arrows.first:90;ballTimer=60;
 p={x:24,y:G,py:G,vx:0,vy:0,w:22,h:40,ground:true,rope:null,s:0,face:1,anim:0,cool:0,rot:0};
 state='count';stTimer=120;snd(440,.15,'square',.06);
}
function newGame(){lvl=0;round=0;lives=5;score=0;streak=0;startSong()}
let songOn=false,songWait=0;
function startSong(){state='song';songF=0;songOn=false;songWait=0;ip={x:W+20,y:H-6,w:22,h:40,ground:true,rope:null,vx:-1,anim:0,face:-1,rot:0};unlock()}
const overPit=cx=>L.pits.some(q=>cx>q.x+4&&cx<q.x+q.w-4);
const pikeH=k=>{if(k.beer)return k.h;const ph=((t*spd()+k.off)%k.per)/k.per;return ph<.45?70*Math.min(1,Math.sin(ph/.45*Math.PI)*1.6):0};

function die(m){if(state!='play')return;state='dead';stTimer=95;msg=m;lives--;streak=0;roundMsg=0;p.rope=null;
 if(p.y<=G+4){p.vy=-6;}snd(420,.7,'sawtooth',.06,70);
 for(let i=0;i<14;i++)parts.push({x:p.x+11,y:p.y-20,vx:(Math.random()-.5)*5,vy:-Math.random()*5,l:40})}

function boxHit(b){const x=p.x+4,y=p.y-p.h+2,w=p.w-8,h=p.h-2;return x<b.x+b.w&&x+w>b.x&&y<b.y+b.h&&y+h>b.y}

function updatePlay(){
 const mv=keys.r-keys.l;
 if(p.cool>0)p.cool--;
 if(p.rope){
   const r=p.rope,th=ropeTh(r),dt=ropeDTh(r);
   const hx=r.ax+Math.sin(th)*p.s,hy=r.ay+Math.cos(th)*p.s;
   p.h=40;p.x=hx-p.w/2;p.y=hy+p.h-4;p.face=1;
   if(jumpPressed){p.vx=Math.cos(th)*dt*p.s+1.2;p.vy=Math.min(-Math.sin(th)*dt*p.s,0)-5.5;p.rope=null;p.cool=24;p.ground=false;snd(330,.15,'square',.05,600)}
 }else{
   if(p.ground){
     const duck=keys.d;p.h=duck?24:40;
     const m=duck?0:mv;p.vx=m*3.2;if(m){p.face=m;p.anim++}
     if(jumpPressed&&!duck){p.vy=-9.2;p.ground=false;p.h=40;snd(380,.16,'square',.05,640)}
   }else{
     p.h=40;p.vx=Math.max(-6,Math.min(6,p.vx+mv*.12));
   }
   p.vy+=.5;p.py=p.y;p.x+=p.vx;p.y+=p.vy;
   if(p.x<4){p.x=4}
   const cx=p.x+p.w/2;
   if(p.y>=G&&p.vy>=0&&p.py<=G+2&&!overPit(cx)){p.y=G;p.vy=0;p.ground=true}
   else if(p.ground&&overPit(cx)){p.ground=false}
   else if(p.y>G){p.ground=false}
   if(p.y>G+40){die('Au! Je viel in de diepte.')}
   if(!p.ground&&p.cool==0){
     const hx=cx,hy=p.y-p.h+4;
     for(const q of L.pits){const r=q.rope;if(!r)continue;const th=ropeTh(r),dx=Math.sin(th),dy=Math.cos(th);
       const s=(hx-r.ax)*dx+(hy-r.ay)*dy;if(s<r.len*.4||s>r.len+6)continue;
       if(Math.hypot(hx-(r.ax+dx*s),hy-(r.ay+dy*s))<14){p.rope=r;p.s=Math.min(s,r.len);p.vx=p.vy=0;snd(240,.1,'triangle',.08);break}}
   }
 }
 // pijlen
 if(L.arrows){arrowTimer-=spd();if(arrowTimer<=0){const c=L.arrows.p[arrowIdx++%L.arrows.p.length];
   const back=c!=c.toUpperCase(),high=c.toUpperCase()=='H';
   arrows.push({x:back?-34:W+10,dx:back?1:-1,y:high?G-32:G-10});if(high)arrows.push({x:back?-34:W+10,dx:back?1:-1,y:G-90});arrowTimer=L.arrows.i;snd(1200,.06,'triangle',.03,700)}}
 for(const a of arrows){a.x+=a.dx*4.2*spd();if(boxHit({x:a.x,y:a.y-2,w:28,h:4}))die(a.dx>0?'Een pijl in je rug!':'Geraakt door een pijl!')}
 arrows=arrows.filter(a=>a.x>-60&&a.x<W+60);
 // kogels en vuurballen
 if(L.balls){ballTimer-=spd();if(ballTimer<=0){const c=L.balls.p[ballIdx++%L.balls.p.length];
   balls.push({x:W+20,y:G-11,vy:0,fire:c=='f',ph:0,fall:false,rot:0});ballTimer=L.balls.i;
   snd(c=='f'?180:110,.3,'sawtooth',.03,c=='f'?420:80)}}
 for(const b of balls){const v=(b.fire?3.4:2.5)*spd();b.x-=v;b.rot-=v/11;
   if(!b.fall&&L.pits.some(q=>!q.guard&&b.x>q.x+4&&b.x<q.x+q.w-4))b.fall=true;
   if(b.fall){b.vy+=.5;b.y+=b.vy}else{b.ph+=v;b.y=G-11-(b.fire?Math.abs(Math.sin(b.ph/40))*16:0)}
   if(b.fire&&gt%2==0)parts.push({x:b.x+7,y:b.y-5+Math.random()*10,vx:.8+Math.random(),vy:-.6-Math.random()*.8,l:16,c:Math.random()<.5?'#ff8a2a':'#ffd23f',ng:1});
   if(boxHit({x:b.x-9,y:b.y-9,w:18,h:18}))die(b.fire?'Au, een vuurbal!':'Overrold door een kogel!')}
 balls=balls.filter(b=>b.x>-30&&b.y<H+30);
 for(const r of L.rocks)if(boxHit({x:r.x+3,y:G-16,w:20,h:16}))die('Gestruikeld over een rotsblok!');
 for(const k of L.pikes)if(k.beer){if(--k.tm<=0){if(k.mode=='down'){const r=Math.random();if(r<.25){k.mode='sip';k.tm=70}else if(r<.42){k.mode='wobble';k.tm=60}else{k.mode='up';k.tm=20+Math.random()*70}}else{k.mode='down';k.tm=30+Math.random()*150}}
   const tg=k.mode=='up'?70:k.mode=='wobble'?28+Math.sin(t*.3)*18:0;k.h+=(tg-k.h)*(k.mode=='up'?.3:.12);if(k.h<.5)k.h=0;
   if(k.mode=='sip'&&k.tm==25){k.hik=70;snd(520,.08,'square',.05,900);snd(380,.1,'square',.04,0,.12)}if(k.hik>0)k.hik--}
 for(const k of L.pikes){const h=pikeH(k);if(h>10&&boxHit({x:k.x+7,y:G-h,w:6,h}))die(k.beer?'Au! De wachter met het biertje prikte je!':'Au, de wachter prikte je!')}
 // doel
 if(state=='play'&&!p.rope&&p.x+p.w>=748&&p.y<=G){
   state='done';stTimer=120;bellSwing=1;bell();
   const pts=500*(round+1)+(Math.max(0,1500-lt*2)|0);score+=pts;msg='+'+pts+' punten';
   streak++;if(streak>=5){streak=0;lives++;msg+='   5 klokken op rij: extra leven!'}
 }
}

let tops=[],topNew=-1;try{tops=JSON.parse(localStorage.getItem('kasteelsprong_top'))||[]}catch(e){}
function addTop(){const d=new Date(),e={s:score,l:lvl+1+round*LEVELS.length,d:d.getDate()+'-'+(d.getMonth()+1)};tops.push(e);tops.sort((a,b)=>b.s-a.s);tops=tops.slice(0,5);topNew=tops.indexOf(e);try{localStorage.setItem('kasteelsprong_top',JSON.stringify(tops))}catch(e){}}
function drawTop(y,size){if(!tops.length)return;txt('Beste scores',W/2,y,size+2,'#f0b83c');tops.forEach((e,i)=>txt((i+1)+'.  '+e.s+' punten   (level '+e.l+', '+e.d+')',W/2,y+22+i*(size+5),size,i==topNew?'#ffe07a':'#c9c3e6','center','system-ui,sans-serif'))}
let paused=false;
function togglePause(){if(state=='play'||state=='count'){paused=!paused;snd(paused?300:600,.1,'triangle',.05)}}
function tick(){
 gt++;if(paused){jumpPressed=false;return}
 if(state=='play'){t++;lt++;if(goTimer>0)goTimer--;updatePlay()}
 else if(state=='count'){stTimer--;if(stTimer==80||stTimer==40)snd(440,.15,'square',.06);
   if(stTimer<=0){state='play';goTimer=40;snd(880,.25,'square',.07)}}
 else if(state=='song'){if(!songOn){if(ac&&ac.state=='running'){playSong();songOn=true}else if(++songWait>40)songOn=true;if(jumpPressed){stopSong();parts=[];loadLevel()}jumpPressed=false;return}songF++;
   const walkEnd=SONG_FRAMES-100;
   if(songF<walkEnd){ip.x=W+20-(W-20)*songF/walkEnd;const hop=songF/(3*EIGHTH*60)*Math.PI;ip.y=H-6-Math.abs(Math.sin(hop))*16;ip.anim=songF;ip.ground=ip.y>H-9}
   else{const k=Math.min(1,(songF-walkEnd)/80),e=k*k*(3-2*k);ip.y=(H-6)+(G-(H-6))*e;ip.face=1;ip.ground=true;ip.vx=0;
     if(gt%3==0&&k<1)parts.push({x:ip.x+Math.random()*24,y:ip.y-Math.random()*40,vx:(Math.random()-.5),vy:-Math.random(),l:30})}
   if(songF>=SONG_FRAMES+15||jumpPressed){stopSong();parts=[];loadLevel()}}
 else if(state=='dead'){stTimer--;p.vy+=.45;p.y+=p.vy;p.rot+=.15;
   if(stTimer<=0){if(lives<=0){state='over';if(score>hi){hi=score;try{localStorage.setItem('kasteelsprong_hi',hi)}catch(e){}}addTop()}else loadLevel()}}
 else if(state=='done'){if(--stTimer<=0){lvl++;if(lvl>=LEVELS.length){lvl=0;round++;lives++;roundMsg=1}else roundMsg=0;loadLevel()}}
 else if((state=='title'||state=='over')&&jumpPressed){newGame()}
 bellSwing*=.988;
 for(const q of parts){q.x+=q.vx;q.y+=q.vy;if(!q.ng)q.vy+=.25;q.l--}parts=parts.filter(q=>q.l>0);
 jumpPressed=false;
}

// ---------- tekenen ----------
const hazardsOn=()=>state!='title'&&state!='song';
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,G);g.addColorStop(0,'#0d1230');g.addColorStop(1,'#3d2f5e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=.5+.5*Math.sin(gt*.03+s.p);ctx.fillStyle='#fff6dc';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
 ctx.fillStyle='#f6ebc4';ctx.beginPath();ctx.arc(650,78,30,0,7);ctx.fill();
 ctx.fillStyle='#e4d6a6';ctx.beginPath();ctx.arc(640,70,5,0,7);ctx.arc(660,92,4,0,7);ctx.arc(662,66,3,0,7);ctx.fill();
 for(const [x,h,w] of towers){ctx.fillStyle='#211c40';ctx.fillRect(x,G-h,w,h);
   ctx.beginPath();ctx.moveTo(x-6,G-h);ctx.lineTo(x+w/2,G-h-w*.9);ctx.lineTo(x+w+6,G-h);ctx.fill();
   ctx.fillStyle='rgba(245,190,90,.75)';ctx.fillRect(x+w/2-3,G-h+18,6,10);if(h>150)ctx.fillRect(x+w/2-3,G-h+60,6,10)}
}
function drawWall(){
 const pitsOn=hazardsOn()&&L;
 ctx.fillStyle='#4a4d66';
 for(let x=0;x<W;x+=40){if(pitsOn&&overPit(x+16))continue;ctx.fillRect(x+4,G-26,24,26)}
 ctx.fillStyle='#3a3c52';ctx.fillRect(0,G-6,W,6);
 ctx.fillStyle='#9a9db3';ctx.fillRect(0,G,W,8);
 ctx.fillStyle='#62657d';ctx.fillRect(0,G+8,W,H-G-8);
 ctx.strokeStyle='#4f5268';ctx.lineWidth=2;
 for(let y=G+8,row=0;y<H;y+=20,row++){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
   for(let x=(row%2)*20;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+20);ctx.stroke()}}
 if(!pitsOn)return;
 for(const q of L.pits){
   const g=ctx.createLinearGradient(0,G-30,0,H);g.addColorStop(0,'#2a2246');g.addColorStop(1,'#05060d');
   ctx.fillStyle=g;ctx.fillRect(q.x,G-6,q.w,H-G+6);
   ctx.fillStyle='#2c2e40';ctx.fillRect(q.x-4,G,4,H-G);ctx.fillRect(q.x+q.w,G,4,H-G);
 }
}
function drawRopes(){
 for(const q of L.pits){const r=q.rope;if(!r)continue;
   ctx.fillStyle='#6b4423';ctx.fillRect(q.x-10,r.ay-10,8,G-r.ay+10);ctx.fillRect(q.x+q.w+2,r.ay-10,8,G-r.ay+10);
   ctx.fillStyle='#82552c';ctx.fillRect(q.x-14,r.ay-16,q.w+28,10);
   const th=ropeTh(r),tx=r.ax+Math.sin(th)*r.len,ty=r.ay+Math.cos(th)*r.len;
   ctx.strokeStyle='#d8b27a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(r.ax,r.ay-6);ctx.lineTo(tx,ty);ctx.stroke();
   ctx.fillStyle='#d8b27a';ctx.beginPath();ctx.arc(tx,ty,4,0,7);ctx.fill();
 }
}
function drawRocks(){for(const r of L.rocks){
 ctx.fillStyle='#5a3a1e';ctx.beginPath();ctx.ellipse(r.x+13,G-8,15,11,0,Math.PI,0);ctx.lineTo(r.x+28,G);ctx.lineTo(r.x-2,G);ctx.fill();
 ctx.fillStyle='#9a6a3a';ctx.beginPath();ctx.ellipse(r.x+13,G-8,13,9,0,Math.PI,0);ctx.lineTo(r.x+26,G-1);ctx.lineTo(r.x,G-1);ctx.fill();
 ctx.fillStyle='#c99a62';ctx.beginPath();ctx.ellipse(r.x+9,G-12,5,3,-.4,0,7);ctx.fill();ctx.fillStyle='#6e4826';ctx.fillRect(r.x+16,G-9,5,2);ctx.fillRect(r.x+6,G-5,4,2)}}
function drawPikes(){for(const k of L.pikes){const h=pikeH(k),rise=Math.min(9,h*.2),cx=k.x+3,top=G+3-rise;
 ctx.save();ctx.beginPath();ctx.rect(k.x-14,G-120,34,300);ctx.clip();
 // stenen nis waar de wachter op staat
 ctx.fillStyle='#4f5268';ctx.fillRect(k.x-12,G+56,30,H-G);ctx.fillStyle='#7d8197';ctx.fillRect(k.x-12,G+56,30,3);ctx.strokeStyle='#3e4155';ctx.lineWidth=1.5;for(let y=G+64;y<H;y+=12){ctx.beginPath();ctx.moveTo(k.x-12,y);ctx.lineTo(k.x+18,y);ctx.stroke()}
 ctx.fillStyle='#3a2a1a';ctx.fillRect(cx-7,top+46,6,G+56-(top+46));ctx.fillRect(cx+1,top+46,6,G+56-(top+46));
 if(k.beer){ctx.translate(cx,G+56);ctx.rotate(Math.sin(t*.05)*.06);ctx.translate(-cx,-(G+56))}
 ctx.fillStyle='#2f5fa8';ctx.fillRect(cx-10,top+13,20,34);ctx.fillStyle='#f0c040';ctx.fillRect(cx-2,top+15,4,20);ctx.fillRect(cx-8,top+21,16,4);
 ctx.fillStyle='#f0c9a0';ctx.fillRect(cx-6,top+2,12,11);ctx.fillStyle='#222';ctx.fillRect(cx-4,top+6,2,2);ctx.fillRect(cx+2,top+6,2,2);ctx.fillRect(cx-3,top+10,6,1);
 ctx.fillStyle='#9aa0ad';ctx.beginPath();ctx.arc(cx,top+2,7,Math.PI,0);ctx.fill();ctx.beginPath();ctx.ellipse(cx,top+2,11,2.8,0,0,7);ctx.fill();
 const tipY=h>2?G-h-4:top-14,base=top+32;
 ctx.fillStyle='#7a5230';ctx.fillRect(k.x+8,tipY+14,4,base-(tipY+14));
 ctx.fillStyle='#d9dde8';ctx.beginPath();ctx.moveTo(k.x+10,tipY-2);ctx.lineTo(k.x+15,tipY+14);ctx.lineTo(k.x+5,tipY+14);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f0c9a0';ctx.beginPath();ctx.arc(k.x+10,top+22,3,0,7);ctx.fill();
 if(k.beer){ctx.fillStyle='#e0574c';ctx.beginPath();ctx.arc(cx,top+9,2.2,0,7);ctx.fill();ctx.fillStyle='rgba(224,87,76,.45)';ctx.beginPath();ctx.arc(cx-4,top+10,2,0,7);ctx.arc(cx+4,top+10,2,0,7);ctx.fill();
   const sip=k.mode=='sip'&&k.tm>25&&k.tm<60,mx=sip?cx-5:cx-12,my=sip?top+4:top+22;ctx.save();ctx.translate(mx,my);if(sip)ctx.rotate(.8);
   ctx.fillStyle='rgba(240,180,40,.95)';ctx.fillRect(-4,-5,8,11);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-5,2.5,0,7);ctx.arc(2,-5,2.5,0,7);ctx.fill();ctx.strokeStyle='#d9dde8';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(-5,1,3,Math.PI*.5,Math.PI*1.5);ctx.stroke();ctx.restore()}
 ctx.restore();
 if(k.beer&&k.hik>0){ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect?ctx.roundRect(cx-6,G-42-(70-k.hik)*.3,34,16,7):ctx.rect(cx-6,G-42,34,16);ctx.fill();ctx.fillStyle='#3a1f0c';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('hik!',cx+11,G-30-(70-k.hik)*.3)}}}
function drawArrows(){for(const a of arrows){
 ctx.save();ctx.translate(a.x+14,a.y);ctx.scale(-a.dx,1);
 ctx.strokeStyle='#c9a46a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(14,0);ctx.stroke();
 ctx.fillStyle='#dfe3ec';ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-8,-4);ctx.lineTo(-8,4);ctx.fill();
 ctx.fillStyle='#d2463c';ctx.fillRect(9,-4,6,3);ctx.fillRect(9,1,6,3);ctx.restore()}}
function drawBalls(){for(const b of balls){
 ctx.save();ctx.translate(b.x,b.y);
 if(b.fire){const g=ctx.createRadialGradient(-2,-2,1,0,0,12);g.addColorStop(0,'#fff3a0');g.addColorStop(.45,'#ffb02e');g.addColorStop(1,'#d8351f');
   ctx.fillStyle='rgba(255,140,40,.25)';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();}
 else{ctx.rotate(b.rot);ctx.fillStyle='#585b6c';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
   ctx.strokeStyle='#3c3e4c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(11,0);ctx.moveTo(0,-11);ctx.lineTo(0,11);ctx.stroke();
   ctx.fillStyle='#8a8d9e';ctx.beginPath();ctx.arc(-4,-4,3,0,7);ctx.fill()}
 ctx.restore()}}
function drawBell(){
 const x=W-36,top=G-96;
 ctx.fillStyle='#6b4423';ctx.fillRect(x-24,top,6,96);ctx.fillRect(x+18,top,6,96);ctx.fillStyle='#82552c';ctx.fillRect(x-28,top-8,56,10);
 ctx.save();ctx.translate(x,top+2);ctx.rotate(Math.sin(gt*.25)*bellSwing*.7);
 ctx.fillStyle='#f0b83c';ctx.beginPath();ctx.moveTo(-5,4);ctx.quadraticCurveTo(-8,20,-16,32);ctx.lineTo(16,32);ctx.quadraticCurveTo(8,20,5,4);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ffd877';ctx.fillRect(-3,8,3,18);ctx.fillStyle='#b27d1c';ctx.beginPath();ctx.arc(0,34,4,0,7);ctx.fill();ctx.restore();
}
function drawPlayer(o){
 const dk=o.ground&&o.h<30&&!o.rope;
 ctx.save();ctx.translate(o.x+o.w/2,o.y);if(state=='dead'&&o===p){ctx.translate(0,-20);ctx.rotate(o.rot);ctx.translate(0,20)}ctx.scale(o.face,1);
 const head=(y,r)=>{ctx.fillStyle='#c4362f';ctx.beginPath();ctx.arc(0,y,r+2,0,7);ctx.fill();
   ctx.beginPath();ctx.moveTo(-r,y-2);ctx.lineTo(-r-9,y+6);ctx.lineTo(-r+2,y+4);ctx.fill();
   ctx.fillStyle='#f3c9a1';ctx.beginPath();ctx.arc(2,y+1,r-1,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(4,y-1,2,2)};
 if(dk){ctx.fillStyle='#4a321d';ctx.fillRect(-9,-6,8,6);ctx.fillRect(2,-6,8,6);
   ctx.fillStyle='#3f7fd8';ctx.fillRect(-10,-17,20,12);head(-21,5.5)}
 else{const sw=o.rope?2:(o.ground&&o.vx?Math.sin(o.anim*.35)*5:3);
   ctx.fillStyle='#4a321d';ctx.fillRect(-6+sw,-12,5,12);ctx.fillRect(1-sw,-12,5,12);
   ctx.fillStyle='#3f7fd8';ctx.fillRect(-8,-28,16,17);ctx.fillStyle='#e7b84a';ctx.fillRect(-8,-15,16,2);
   ctx.fillStyle='#f3c9a1';if(o.rope){ctx.fillRect(-2,-42,4,16)}else{ctx.fillRect(-10,-26,3,10);ctx.fillRect(7,-26,3,10)}
   head(-34,6)}
 ctx.restore();
}
function txt(s,x,y,size,col='#ffe2a8',align='center',font='Georgia,"Times New Roman",serif'){
 ctx.font='bold '+size+'px '+font;ctx.textAlign=align;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(s,x+2,y+2);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function miniBell(x,y,lit){ctx.fillStyle=lit?'#f0b83c':'rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(x-2,y);ctx.quadraticCurveTo(x-4,y+7,x-7,y+11);ctx.lineTo(x+7,y+11);ctx.quadraticCurveTo(x+4,y+7,x+2,y);ctx.closePath();ctx.fill()}
function draw(){
 drawSky();drawWall();drawBell();
 if(hazardsOn()&&L){drawRopes();drawPikes();drawRocks();drawBalls();drawArrows();if(state!='over')drawPlayer(p)}
 if(state=='song')drawPlayer(ip);
 for(const q of parts){ctx.fillStyle=q.c||'#ffd877';ctx.globalAlpha=Math.min(1,q.l/20);ctx.fillRect(q.x,q.y,3,3)}ctx.globalAlpha=1;
 if(state=='title'){
   ctx.fillStyle='rgba(13,18,48,.55)';ctx.fillRect(0,0,W,H);
   txt('Kasteelsprong',W/2,140,64);
   txt('Ren over de muur, spring over rotsen en kogels, duik onder pijlen door',W/2,182,18,'#f6ebc4');
   txt('en luid de klok aan het eind van elk level.',W/2,206,18,'#f6ebc4');
   if(gt%60<40)txt('Druk op spatie of tik om te beginnen',W/2,262,22);
   txt('← → lopen   spatie springen   ↓ bukken (dubbele pijl? alleen bukken helpt!)',W/2,300,14,'#c9c3e6','center','system-ui,sans-serif');
   drawTop(330,13);
   if(innerHeight>innerWidth)txt('Tip: draai je telefoon',W/2,52,16,'#c9c3e6','center','system-ui,sans-serif');
   return}
 if(state=='song'){txt('Kasteelsprong',W/2,120,46);txt('Spatie of tik om over te slaan',W/2,156,14,'#c9c3e6','center','system-ui,sans-serif');return}
 const num=lvl+1+round*LEVELS.length;
 txt('Level '+num+'  '+L.name,58,30,18,'#ffe2a8','left');
 txt('Punten '+score,W/2,30,18,'#f6ebc4');
 txt('♥'.repeat(Math.max(0,lives)),W-58,30,20,'#e0574c','right','system-ui,sans-serif');
 for(let i=0;i<5;i++)miniBell(66+i*18,42,i<streak);
 if(state=='count'){const n=Math.ceil(stTimer/40),f=(stTimer%40)/40;
   txt('Level '+num,W/2,120,30,'#f6ebc4');txt(L.name,W/2,152,22,'#f6ebc4');
   if(roundMsg)txt('Ronde '+(round+1)+': alles gaat sneller!',W/2,186,18,'#f0b83c');
   txt(String(n),W/2,250,60+f*30,'#ffe2a8')}
 if(state=='play'&&goTimer>0){ctx.globalAlpha=goTimer/40;txt('Start!',W/2,240,56);ctx.globalAlpha=1}
 if(state=='dead')txt(msg,W/2,170,28,'#ffb3a8');
 if(state=='done'){txt('Bong! De klok luidt.',W/2,160,34);txt(msg,W/2,200,20,'#f0b83c')}
 if(state=='over'){ctx.fillStyle='rgba(13,18,48,.65)';ctx.fillRect(0,0,W,H);
   txt('Game over',W/2,110,52);txt('Punten: '+score+(topNew==0?'   Nieuw record!':''),W/2,150,22,'#f6ebc4');drawTop(200,14);
   if(gt%60<40)txt('Druk op spatie of tik om opnieuw te spelen',W/2,330,20)}
 if(paused){ctx.fillStyle='rgba(13,18,48,.6)';ctx.fillRect(0,0,W,H);txt('Pauze',W/2,200,56);txt('Druk op P of tik om verder te spelen',W/2,250,18,'#f6ebc4')}
}

// ---------- lus ----------
lvl=0;loadLevel();state='title';
let acc=0,last=performance.now();
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){tick();acc-=1000/60}draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
